<title>O Cartógrafo de Venn</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/*
  ESTILOS DA INTERFACE (HTML por cima do canvas)
  Cores definidas como variáveis em :root; telas, diálogos, botões e painel de cima.
*/
/* Layout: tela única — barra de status, barra de missão e o mar (canvas) ocupando o resto; telas e diálogos sobrepostos ao mar */
:root {
  --sea: #0d3242;
  --sea-deep: #06161f;
  --panel: #0c2b39;
  --line: #2a5566;
  --ink: #eaf2ee;
  --muted: #9bb5b0;
  --brass: #e0b04f;
  --brass-deep: #a97b25;
  --f: #ef7d45;
  --n: #46b3ea;
  --a: #8fd45e;
  --ok: #51d68f;
  --bad: #ff6166;
  --code: #ffe3a3;
  --display: "IM Fell English SC", Georgia, "Times New Roman", serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
[hidden] {
  display: none !important;
}
html {
  height: 100%;
  box-sizing: border-box;
}
*,
*::before,
*::after {
  box-sizing: inherit;
}
body {
  height: 100%;
  margin: 0;
  background: var(--sea-deep);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
#app {
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-block: 10px;
}
#topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 40px;
}
#phName {
  font-family: var(--display);
  font-size: 21px;
  color: var(--brass);
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#lives {
  display: flex;
  gap: 2px;
}
.heart {
  color: var(--bad);
  font-size: 19px;
  line-height: 1;
}
.heart.off {
  opacity: 0.22;
}
#timer {
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  min-width: 4ch;
  text-align: right;
}
#timer.low {
  color: var(--bad);
}
.icon-btn {
  flex: none;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1.5px solid var(--line);
  background: transparent;
  color: var(--ink);
  font: 700 14px var(--body);
  cursor: pointer;
}
.icon-btn:hover {
  border-color: var(--brass);
  color: var(--brass);
}
.icon-btn.off {
  text-decoration: line-through;
  opacity: 0.6;
}
#infobar {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 8px 14px;
  line-height: 1.45;
  font-size: 14.5px;
}
.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 16px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.stats .dim,
.dim {
  color: var(--muted);
  font-weight: 600;
}
.sub2 {
  color: var(--muted);
  margin-top: 2px;
}
.sub2 b {
  color: var(--ink);
}
.qline {
  font-size: 15.5px;
  font-weight: 600;
}
.qline b {
  color: var(--code);
}
.optl {
  list-style: none;
  margin: 6px 0 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 4px 16px;
}
.optl li {
  display: flex;
  gap: 8px;
  align-items: baseline;
  min-width: 0;
}
.optl .k,
.opt .k {
  flex: none;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: inline-grid;
  place-items: center;
  background: var(--brass);
  color: #2a1b04;
  font-weight: 800;
  font-size: 12.5px;
}
#stage {
  position: relative;
  flex: 1;
  min-height: 0;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: #0e3a4b;
}
#cv {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}
#flash {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 2;
}
#flash.ok {
  animation: fok 0.55s ease-out;
}
#flash.bad {
  animation: fbad 0.55s ease-out;
}
@keyframes fok {
  from {
    box-shadow:
      inset 0 0 0 6px var(--ok),
      inset 0 0 90px rgba(81, 214, 143, 0.45);
  }
  to {
    box-shadow: inset 0 0 0 0 rgba(81, 214, 143, 0);
  }
}
@keyframes fbad {
  from {
    box-shadow:
      inset 0 0 0 6px var(--bad),
      inset 0 0 90px rgba(255, 97, 102, 0.45);
  }
  to {
    box-shadow: inset 0 0 0 0 rgba(255, 97, 102, 0);
  }
}
#toast {
  position: absolute;
  left: 50%;
  top: 12px;
  transform: translateX(-50%);
  width: min(580px, calc(100% - 24px));
  z-index: 4;
  background: var(--panel);
  border: 1.5px solid var(--brass);
  border-radius: 12px;

}

}
.tst {

}
.tst .avatar {
  box-shadow: 0 0 0 2px var(--brass);
}
#toast.show {
  animation: tin 0.25s ease-out;
}
@keyframes tin {
  from {
    opacity: 0;
    transform: translate(-50%, -8px);
  }
  to {
    opacity: 1;
    transform: translate(-50%, 0);
  }
}
#btnAction {

  right: max(14px, env(safe-area-inset-right, 0px));
  bottom: 14px;
  z-index: 3;
  min-width: 0;
}
#screen {

.btn {

<div id="app">
  <header id="topbar" hidden>
    <div id="phName">Fase</div>
    <div id="lives"></div>
    <div id="timer" aria-label="Tempo restante"></div>
    <button class="icon-btn" id="btnMusic" aria-label="Ligar ou desligar a música" aria-pressed="true">♫</button>
    <button class="icon-btn" id="btnSound" aria-label="Ligar ou desligar os efeitos sonoros" aria-pressed="true">♪</button>
    <button class="icon-btn" id="btnPause" aria-label="Pausar">❚❚</button>
  </header>
  <section id="infobar" hidden></section>
  <main id="stage">
    <canvas id="cv" aria-label="Mapa do jogo"></canvas>
    <div id="flash"></div>
    <div id="toast" hidden role="status"></div>
    <button id="btnAction" class="btn primary" hidden>Soltar carga</button>
    <div id="screen" hidden></div>
  </main>
</div>

<script>
(() => {
  'use strict';

  // =============================================================================
  //   O CARTÓGRAFO DE VENN — jogo educativo sobre conjuntos
  //   Disciplina: T162 Resolução de Problemas de Natureza Discreta (UNIFOR)
  //   Professor: Paulo Henrique
  //   Conteúdo: cardinalidade, Princípio da Inclusão e Exclusão e Diagrama de Venn
  //
  //   COMO O CÓDIGO ESTÁ ORGANIZADO (na ordem em que aparece):
  //     1. Configuração ............ nomes da equipe
  //     2. Base .................... funções utilitárias e salvamento das estrelas
  //     3. Som e trilha sonora ..... efeitos e músicas gerados pela Web Audio API
  //     4. Tela e escala ........... adapta o mapa ao PC (paisagem) e ao celular (retrato)
  //     5. Entrada ................. teclado, mouse e toque
  //     6. Barco ................... física do barco
  //     7. Desenho ................. tudo o que aparece no canvas (mar, ilhas, rochas…)
  //     8. Feedback e HUD .......... brilho de acerto/erro, mensagens e painel de cima
  //     9. Telas ................... menu, diálogos do Mestre, perguntas, pausa, fim
  //    10. Layouts fixos ........... posição das rochas e redemoinhos
  //    11. Fases 1 a 5 ............. uma função por fase, todas no mesmo molde
  //    12. Laço principal .......... roda ~60 vezes por segundo
  //
  //   IDEIA MATEMÁTICA CENTRAL:
  //     Cada conjunto é um CÍRCULO no mapa. Um ponto (x, y) pertence ao conjunto
  //     quando a distância até o centro é menor que o raio:
  //         pertence(A) = dist(x, y, A.x, A.y) < A.r
  //     As regiões do Diagrama de Venn saem da lógica booleana:
  //         A ∩ B  ->  inA && inB          A − B   ->  inA && !inB
  //         A ∪ B  ->  inA || inB          (A∪B)ᶜ  ->  !inA && !inB
  // =============================================================================
  // ================== CONFIGURAÇÃO ==================
  // Coloque aqui os nomes da equipe (aparecem nos créditos)

  // Nomes que aparecem na tela de Créditos.
  const EQUIPE = ['Caio Portela', 'David Pesquera', 'Ian Vieira', 'Diego Gibaja', 'Arthur Moura'];

  // ================== BASE ==================
  const $ = s => document.querySelector(s);
  const cv = $('#cv'),
    ctx = cv.getContext('2d'),
    stage = $('#stage'),
    scr = $('#screen');
  const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  // Paleta de cores usada no canvas: F = Ferreiros (laranja), N = Navegantes (azul), A = Alquimistas (verde).
  const COL = {
    f: '#ef7d45',
    n: '#46b3ea',
    a: '#8fd45e',
    ok: '#51d68f',
    bad: '#ff6166',
    brass: '#e0b04f',
    ink: '#eaf2ee',
    muted: '#9bb5b0',
  };
  const FONT = 'Nunito, system-ui, sans-serif';
  const rnd = (a, b) => a + Math.random() * (b - a),
    ri = (a, b) => Math.floor(rnd(a, b + 1));
  const shuffle = arr => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // Estrelas de cada fase (0 a 3). Ficam salvas no navegador (localStorage); se não der para salvar, o jogo funciona igual.
  let save = { stars: [0, 0, 0, 0, 0] };
  try {
    const s = JSON.parse(localStorage.getItem('cartografo-venn') || 'null');
    if (s && Array.isArray(s.stars) && s.stars.length === 5) save = s;
  } catch (e) {}

  // Grava as estrelas no navegador.
  function persist() {
    try {
      localStorage.setItem('cartografo-venn', JSON.stringify(save));
    } catch (e) {}
  }

  /*
   * Estado global: T = tempo total em segundos, state = tela atual ('menu', 'dialog', 'play', 'paused', 'result'),
   * phase = objeto da fase em andamento, phaseIdx = número da fase (1 a 5).
   */
  let T = 0,
    last = 0,
    state = 'menu',
    phase = null,
    phaseIdx = 1;
  const wake = [],
    floats = [];
  let shakeT = 0;

  // ================== SOM ==================
  let AC = null,
    muted = false;

  // O navegador só libera som depois de um clique ou toque; esta função cria/retoma o AudioContext nesse momento.
  function ensureAudio() {
    if (!AC) {
      try {
        AC = new (window.AudioContext || window.webkitAudioContext)();
      } catch (e) {}
    }
    if (AC && AC.state === 'suspended') AC.resume();
  }

  /*
   * Toca UMA nota sintetizada: frequência f (Hz), duração, tipo de onda e volume.
   * O volume sobe rápido e cai de forma exponencial, o que dá o som de 'plim'.
   * 'slide' faz a nota escorregar de frequência (usado no som de erro).
   */
  function tone(f, dur, type, vol, delay, slide) {
    if (!AC || muted) return;
    const t = AC.currentTime + (delay || 0);
    const o = AC.createOscillator(),
      g = AC.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(AC.destination);
    o.start(t);
    o.stop(t + dur + 0.03);
  }

  /*
   * Efeitos sonoros: cada um é uma combinação de tons.
   * ok = três notas subindo (acerto) · bad = som grave descendo (erro) · hit = batida · win = fim de fase.
   */
  const SFX = {
    ok() {
      tone(660, 0.12, 'triangle', 0.18);
      tone(880, 0.12, 'triangle', 0.18, 0.09);
      tone(1320, 0.22, 'triangle', 0.14, 0.18);
    },
    bad() {
      tone(220, 0.32, 'sawtooth', 0.11, 0, -120);
      tone(110, 0.36, 'square', 0.07, 0.05);
    },
    pick() {
      tone(520, 0.09, 'square', 0.07, 0, 320);
    },
    hit() {
      tone(95, 0.26, 'sawtooth', 0.17, 0, -50);
    },
    win() {
      [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.28, 'triangle', 0.15, i * 0.12));
    },
    click() {
      tone(420, 0.05, 'sine', 0.05);
    },
    zap() {
      tone(1300, 0.22, 'sawtooth', 0.07, 0, -1000);
    },
  };
  document.addEventListener('pointerdown', ensureAudio);

  // ================== TRILHA SONORA (gerada na hora com Web Audio) ==================
  // Progressão Lá menor – Fá – Dó – Sol, estilo cantiga de marinheiro. 8 passos por compasso, 4 compassos.

  // Estado da música: modo atual ('menu', 'play' ou 'boss'), passo do sequenciador e volume geral.
  const MUSIC = { on: false, muted: false, step: 0, next: 0, gain: null, mode: 'menu', noise: null };
  // Três músicas no mesmo clima de cantiga de marinheiro:
  // menu = Lá menor (Lám–Fá–Dó–Sol); fases = Ré menor (Rém–Si♭–Fá–Dó); chefão = a música das fases, mais rápida e frenética.
  const MEL_PLAY = [
    74, 0, 77, 76, 74, 0, 69, 0, 70, 0, 74, 0, 77, 0, 74, 72, 72, 0, 69, 0, 72, 74, 77, 0, 76, 74, 72, 0, 69,
    0, 72, 0,
  ];

  /*
   * As três músicas. Cada uma tem 4 compassos de 8 passos:
   *   bass = nota do baixo de cada compasso · pad = acorde de cada compasso · mel = melodia (32 notas, 0 = pausa)
   *   drums: 0 = sem bateria, 1 = leve, 2 = frenética · arp = arpejo rápido (só no chefão).
   * As notas estão em número MIDI (69 = Lá 440 Hz).
   */
  const SONGS = {
    menu: {
      bpm: 96,
      bass: [45, 41, 48, 43],
      pad: [
        [57, 60, 64],
        [53, 57, 60],
        [52, 55, 60],
        [55, 59, 62],
      ],
      mel: [
        69, 0, 72, 0, 76, 74, 72, 0, 72, 0, 69, 0, 65, 0, 69, 72, 67, 0, 72, 0, 76, 0, 79, 76, 74, 0, 71, 0,
        67, 69, 71, 0,
      ],
      drums: 0,
      arp: false,
    },
    play: {
      bpm: 112,
      bass: [50, 46, 41, 48],
      pad: [
        [62, 65, 69],
        [58, 62, 65],
        [57, 60, 65],
        [55, 60, 64],
      ],
      mel: MEL_PLAY,
      drums: 1,
      arp: false,
    },
    boss: {
      bpm: 152,
      bass: [50, 46, 41, 48],
      pad: [
        [62, 65, 69],
        [58, 62, 65],
        [57, 60, 65],
        [55, 60, 64],
      ],
      mel: MEL_PLAY,
      drums: 2,
      arp: true,
    },
  };
  const midi = m => 440 * Math.pow(2, (m - 69) / 12);

  // Toca uma nota da música (número MIDI m) no instante t.
  function mnote(m, t, dur, type, vol) {
    const o = AC.createOscillator(),
      g = AC.createGain();
    o.type = type;
    o.frequency.setValueAtTime(midi(m), t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(MUSIC.gain);
    o.start(t);
    o.stop(t + dur + 0.05);
  }

  // Ruído branco filtrado: vira chimbal e caixa da bateria.
  function mnoise(t, dur, vol, hp) {
    if (!MUSIC.noise) {
      const len = AC.sampleRate * 0.3,
        buf = AC.createBuffer(1, len, AC.sampleRate),
        d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      MUSIC.noise = buf;
    }
    const s = AC.createBufferSource(),
      f = AC.createBiquadFilter(),
      g = AC.createGain();
    s.buffer = MUSIC.noise;
    f.type = 'highpass';
    f.frequency.value = hp;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(MUSIC.gain);
    s.start(t);
    s.stop(t + dur + 0.02);
  }

  // Bumbo: uma onda que desce rápido de 140 Hz para 40 Hz.
  function kick(t, vol) {
    const o = AC.createOscillator(),
      g = AC.createGain();
    o.frequency.setValueAtTime(140, t);
    o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
    o.connect(g).connect(MUSIC.gain);
    o.start(t);
    o.stop(t + 0.17);
  }

  // Toca o passo i (0 a 31) da música atual: acorde no início do compasso, baixo, melodia, arpejo e bateria.
  function playStep(i, t, spb) {
    const S = SONGS[MUSIC.mode],
      bar = Math.floor(i / 8),
      s = i % 8,
      root = S.bass[bar],
      chord = S.pad[bar];
    if (s === 0) chord.forEach(m => mnote(m, t, spb * 8, 'sine', 0.035));
    if (S.drums === 2) {
      if (s % 2 === 0) mnote(s % 4 === 0 ? root : root + 12, t, spb * 1.6, 'triangle', 0.12);
    } else {
      if (s === 0 || s === 4) mnote(root, t, spb * 3, 'triangle', 0.11);
      if (s === 6) mnote(root + 7, t, spb * 1.5, 'triangle', 0.07);
    }
    if (S.mel[i]) mnote(S.mel[i], t, spb * (S.drums === 2 ? 1.2 : 1.6), 'square', 0.028);
    if (S.arp) mnote(chord[s % 3] + 12, t, spb * 0.8, 'triangle', 0.022);
    if (S.drums === 1) {
      if (s === 0 || s === 4) kick(t, 0.13);
      if (s % 2 === 0) mnoise(t, 0.04, 0.02, 8000);
    }
    if (S.drums === 2) {
      if (s === 0 || s === 3 || s === 4 || s === 7) kick(t, 0.22);
      mnoise(t, 0.05, s % 2 ? 0.05 : 0.03, 7000);
      if (s === 2 || s === 6) mnoise(t, 0.14, 0.08, 1800);
    }
  }

  // Liga a música no primeiro clique ou tecla.
  function startMusic() {
    ensureAudio();
    if (!AC || MUSIC.on) return;
    MUSIC.gain = AC.createGain();
    MUSIC.gain.gain.value = MUSIC.muted ? 0 : 0.8;
    MUSIC.gain.connect(AC.destination);
    MUSIC.on = true;
    MUSIC.next = AC.currentTime + 0.08;
    MUSIC.step = 0;
  }

  // Troca de música: menu, fases ou chefão.
  function setMusic(mode) {
    if (MUSIC.mode !== mode) {
      MUSIC.mode = mode;
      MUSIC.step = 0;
    }
  }

  /*
   * Sequenciador: a cada 60 ms agenda as notas dos próximos 0,3 s.
   * Agendar um pouco à frente evita a música 'engasgar' quando o jogo está pesado.
   */
  setInterval(() => {
    if (!AC || !MUSIC.on) return;
    if (AC.state !== 'running') return;
    const spb = 60 / SONGS[MUSIC.mode].bpm / 2;
    if (MUSIC.next < AC.currentTime) MUSIC.next = AC.currentTime + 0.05;
    while (MUSIC.next < AC.currentTime + 0.3) {
      playStep(MUSIC.step, MUSIC.next, spb);
      MUSIC.next += spb;
      MUSIC.step = (MUSIC.step + 1) % 32;
    }
  }, 60);
  document.addEventListener('pointerdown', startMusic);
  addEventListener('keydown', startMusic);

  // ================== TELA / ESCALA ==================

  /*
   * O jogo usa um 'mundo' de tamanho fixo (LW × LH) e só depois escala para a tela.
   * scale = quanto o mundo cresce/encolhe · offX/offY = margem para centralizar
   * UI = aumenta textos e etiquetas no celular, onde o mapa fica pequeno.
   */
  let UI = 1,
    lockDims = false,
    LW = 960,
    LH = 600,
    scale = 1,
    offX = 0,
    offY = 0,
    dpr = 1,
    cssW = 1,
    cssH = 1;

  // Tela larga (PC) -> mundo 960×600. Tela em pé (celular) -> mundo 600×960.
  function chooseDims() {
    const r = stage.getBoundingClientRect();
    if (r.width >= r.height * 0.95) {
      LW = 960;
      LH = 600;
    } else {
      LW = 600;
      LH = 960;
    }
  }

  // Recalcula o tamanho do canvas e a escala sempre que a janela muda.
  function resize() {
    const r = stage.getBoundingClientRect();
    cssW = Math.max(1, r.width);
    cssH = Math.max(1, r.height);
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(cssW * dpr);
    cv.height = Math.round(cssH * dpr);
    if (!phase && !lockDims) chooseDims();
    scale = Math.min(cssW / LW, cssH / LH);
    UI = Math.min(1.7, Math.max(1, 0.9 / scale));
    offX = (cssW - LW * scale) / 2;
    offY = (cssH - LH * scale) / 2;
  }
  if (window.ResizeObserver) new ResizeObserver(() => resize()).observe(stage);
  else window.addEventListener('resize', resize);

  // Prepara o canvas para desenhar em coordenadas do mundo (inclui a tremida da tela).
  function setWorld() {
    const k = shakeT > 0 ? shakeT / 0.35 : 0;
    const sx = k ? (Math.random() - 0.5) * 12 * k : 0,
      sy = k ? (Math.random() - 0.5) * 12 * k : 0;
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * (offX + sx), dpr * (offY + sy));
  }

  // ================== ENTRADA ==================
  const keys = {};
  addEventListener('keydown', e => {
    ensureAudio();
    const k = e.key.toLowerCase();
    keys[k] = true;
    if (state === 'play') {
      if (e.key === ' ') {
        e.preventDefault();
        phase && phase.action && phase.action();
      }
      if (e.key.startsWith('Arrow')) e.preventDefault();
      if (k === 'escape' || k === 'p') {
        pause();
      }
    }
    if (/^[1-4]$/.test(e.key) && !scr.hidden) {
      const o = scr.querySelectorAll('.opt:not(:disabled)');
      const el = o[+e.key - 1];
      if (el) el.click();
    }
  });
  addEventListener('keyup', e => {
    keys[e.key.toLowerCase()] = false;
  });
  addEventListener('blur', () => {
    for (const k in keys) keys[k] = false;
    ptr.active = false;
  });
  const ptr = { active: false, x: 0, y: 0 };

  // Converte a posição do dedo/mouse na tela para coordenadas do mundo do jogo.
  function toLogical(e) {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left - offX) / scale, y: (e.clientY - r.top - offY) / scale };
  }
  cv.addEventListener('pointerdown', e => {
    ptr.active = true;
    Object.assign(ptr, toLogical(e));
    try {
      cv.setPointerCapture(e.pointerId);
    } catch (_) {}
  });
  cv.addEventListener('pointermove', e => {
    if (ptr.active) Object.assign(ptr, toLogical(e));
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev =>
    cv.addEventListener(ev, () => {
      ptr.active = false;
    }),
  );

  // Lê setas e WASD e devolve a direção desejada (dx, dy), cada uma entre -1 e 1.
  function dirInput() {
    let dx = 0,
      dy = 0;
    if (keys.arrowleft || keys.a) dx--;
    if (keys.arrowright || keys.d) dx++;
    if (keys.arrowup || keys.w) dy--;
    if (keys.arrowdown || keys.s) dy++;
    return { dx, dy };
  }

  // ================== BARCO ==================

  // Cria o barco: posição (x, y), velocidade (vx, vy), ângulo, raio de colisão e tempo de invencibilidade.
  function Boat(x, y) {
    return { x, y, vx: 0, vy: 0, ang: -Math.PI / 2, r: 13, inv: 0, hitCd: 0 };
  }

  /*
   * FÍSICA DO BARCO, chamada a cada quadro:
   *   1. lê a direção (teclado ou toque)
   *   2. soma a aceleração na velocidade
   *   3. aplica atrito (a velocidade perde um pouco a cada quadro)
   *   4. limita a velocidade máxima
   *   5. move o barco e impede que ele saia da área
   * Tudo é multiplicado por dt (tempo do quadro), então a velocidade é a mesma em PC rápido ou lento.
   */
  function steer(b, dt, box, o) {
    o = o || {};
    let { dx, dy } = dirInput();
    if (ptr.active) {
      const tx = ptr.x - b.x,
        ty = o.lockY ? 0 : ptr.y - b.y,
        d = Math.hypot(tx, ty);
      if (d > 6) {
        const k = Math.min(1, d / 70);
        dx = (tx / d) * k;
        dy = (ty / d) * k;
      } else {
        dx = 0;
        dy = 0;
      }
    }
    if (o.lockY) dy = 0;
    const l = Math.hypot(dx, dy);
    if (l > 1) {
      dx /= l;
      dy /= l;
    }
    const acc = o.acc || 900,
      max = o.max || 230;
    b.vx += dx * acc * dt;
    b.vy += dy * acc * dt;
    const drag = Math.exp(-3.2 * dt);
    b.vx *= drag;
    b.vy *= drag;
    const sp = Math.hypot(b.vx, b.vy);
    if (sp > max) {
      b.vx *= max / sp;
      b.vy *= max / sp;
    }
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.x < box.x + b.r) {
      b.x = box.x + b.r;
      b.vx *= -0.3;
    }
    if (b.x > box.x + box.w - b.r) {
      b.x = box.x + box.w - b.r;
      b.vx *= -0.3;
    }
    if (b.y < box.y + b.r) {
      b.y = box.y + b.r;
      b.vy *= -0.3;
    }
    if (b.y > box.y + box.h - b.r) {
      b.y = box.y + box.h - b.r;
      b.vy *= -0.3;
    }
    if (!o.fixedAng && sp > 15) b.ang = Math.atan2(b.vy, b.vx);
    if (b.inv > 0) b.inv -= dt;
    if (b.hitCd > 0) b.hitCd -= dt;
    if (sp > 40 && Math.random() < dt * 30)
      wake.push({ x: b.x - Math.cos(b.ang) * 13, y: b.y - Math.sin(b.ang) * 13, t: 0 });
  }

  // ================== DESENHO ==================

  // Atalho para desenhar um círculo.
  function circ(x, y, r) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
    else ctx.rect(x, y, w, h);
  }

  // Desenha o mar: fundo, ondinhas e brilhos.
  function drawSea(scroll) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const g = ctx.createRadialGradient(
      cssW / 2,
      cssH * 0.45,
      0,
      cssW / 2,
      cssH * 0.45,
      Math.max(cssW, cssH) * 0.75,
    );
    g.addColorStop(0, '#13465a');
    g.addColorStop(1, '#0e3a4b');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, cssW, cssH);
    setWorld();
    ctx.save();
    ctx.strokeStyle = 'rgba(175,225,235,.13)';
    ctx.lineWidth = 1.5;
    const s = 48,
      off = ((scroll % s) + s) % s,
      base = Math.floor(scroll / s);
    const x0 = -offX / scale - s * 2,
      x1 = (cssW - offX) / scale + s,
      y0 = -offY / scale,
      y1 = (cssH - offY) / scale + s;
    for (let k = Math.floor(y0 / s) - 2; k * s < y1; k++) {
      const y = k * s + off;
      const row = k - base;
      for (let x = x0; x < x1; x += s * 1.7) {
        const ox = x + (((row % 2) + 2) % 2) * s * 0.85 + Math.sin(T * 0.8 + row * 0.6) * 6;
        ctx.beginPath();
        ctx.moveTo(ox, y);
        ctx.quadraticCurveTo(ox + 8, y - 5, ox + 16, y);
        ctx.quadraticCurveTo(ox + 24, y + 5, ox + 32, y);
        ctx.stroke();
      }
    }
    for (let i = 0; i < 14; i++) {
      const a = Math.sin(T * 1.7 + i * 2.3);
      if (a < 0.6) continue;
      const x = (i * 173) % LW,
        y = (((i * 97) % LH) + scroll) % LH;
      ctx.fillStyle = `rgba(230,248,252,${((a - 0.6) * 1.6).toFixed(3)})`;
      ctx.fillRect(x - 1, y - 0.6, 6, 1.4);
      ctx.fillRect(x + 2, y - 2.5, 1.4, 5);
    }
    ctx.restore();
  }

  // Desenha o retângulo tracejado do conjunto universo U.
  function drawU(U, label) {
    ctx.save();
    ctx.strokeStyle = 'rgba(224,176,79,.55)';
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 8]);
    ctx.strokeRect(U.x, U.y, U.w, U.h);
    ctx.setLineDash([]);
    ctx.font = `800 ${13 * UI}px ${FONT}`;
    ctx.fillStyle = 'rgba(224,176,79,.9)';
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    ctx.fillText(label, U.x + 10, U.y + 8);
    ctx.restore();
  }
  function hexA(h, a) {
    const n = parseInt(h.slice(1), 16);
    return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a.toFixed(3)})`;
  }

  /*
   * Desenha um território (conjunto) como círculo semitransparente.
   * Como é transparente, a interseção fica com as duas cores misturadas.
   */
  function drawTerr(c, alpha) {
    alpha = alpha == null ? 1 : alpha;
    ctx.save();
    const g = ctx.createRadialGradient(c.x, c.y, c.r * 0.15, c.x, c.y, c.r);
    g.addColorStop(0, hexA(c.color, 0.08 * alpha));
    g.addColorStop(1, hexA(c.color, 0.32 * alpha));
    ctx.fillStyle = g;
    circ(c.x, c.y, c.r);
    ctx.fill();
    ctx.globalAlpha = alpha;
    ctx.lineWidth = 3.5;
    ctx.strokeStyle = c.color;
    circ(c.x, c.y, c.r);
    ctx.stroke();
    ctx.restore();
  }
  function drawEmblem(k, x, y, col) {
    ctx.save();
    ctx.translate(x, y);
    ctx.strokeStyle = col;
    ctx.fillStyle = col;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    if (k === 'F') {
      ctx.rotate(-0.6);
      ctx.beginPath();
      ctx.moveTo(0, -1);
      ctx.lineTo(0, 8);
      ctx.stroke();
      ctx.fillRect(-6, -6, 12, 5);
    } else if (k === 'N') {
      circ(0, -6, 2.4);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, -3.5);
      ctx.lineTo(0, 7);
      ctx.moveTo(-4, -1);
      ctx.lineTo(4, -1);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 1, 6, 0.25 * Math.PI, 0.75 * Math.PI);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(-2, -7);
      ctx.lineTo(-2, -2);
      ctx.lineTo(-6, 6);
      ctx.lineTo(6, 6);
      ctx.lineTo(2, -2);
      ctx.lineTo(2, -7);
      ctx.stroke();
      ctx.globalAlpha = 0.6;
      ctx.beginPath();
      ctx.moveTo(-4.5, 3);
      ctx.lineTo(4.5, 3);
      ctx.lineTo(5.5, 5.5);
      ctx.lineTo(-5.5, 5.5);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // Etiqueta com ícone e nome do território (ex.: 'Ferreiros · F').
  function drawLabel(c, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    const fs = 16 * UI,
      h = fs * 0.9;
    ctx.font = `800 ${fs}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const w = ctx.measureText(c.name).width + 44 * UI;
    ctx.fillStyle = 'rgba(6,22,31,.85)';
    roundRect(c.lx - w / 2, c.ly - h, w, h * 2, h);
    ctx.fill();
    ctx.strokeStyle = hexA(c.color, 0.6);
    ctx.lineWidth = 1.5;
    roundRect(c.lx - w / 2, c.ly - h, w, h * 2, h);
    ctx.stroke();
    ctx.save();
    ctx.translate(c.lx - w / 2 + 15 * UI, c.ly);
    ctx.scale(UI, UI);
    drawEmblem(c.name.slice(-1), 0, 0, c.color);
    ctx.restore();
    ctx.fillStyle = c.color;
    ctx.fillText(c.name, c.lx + 10 * UI, c.ly + 1);
    ctx.restore();
  }

  /*
   * Pinta uma região do Venn. 'test(x, y)' diz se o ponto está na região;
   * o mapa é varrido em quadradinhos de 8 px e cada um que passa no teste é pintado.
   * É isso que acende a região certa quando o jogador erra.
   */
  function fillRegion(U, test, color, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    const s = 8;
    for (let x = U.x; x < U.x + U.w; x += s)
      for (let y = U.y; y < U.y + U.h; y += s)
        if (test(x + s / 2, y + s / 2)) ctx.fillRect(x, y, s + 0.6, s + 0.6);
    ctx.restore();
  }

  // Acha um ponto bem no meio de uma região do Venn (usado para colocar os pergaminhos da Fase 4).
  function regionPoint(U, test) {
    let sx = 0,
      sy = 0,
      n = 0;
    const cells = [];
    for (let x = U.x; x < U.x + U.w; x += 6)
      for (let y = U.y; y < U.y + U.h; y += 6)
        if (test(x, y)) {
          sx += x;
          sy += y;
          n++;
          cells.push([x, y]);
        }
    if (!n) return { x: U.x + U.w / 2, y: U.y + U.h / 2 };
    const cx = sx / n,
      cy = sy / n;
    if (test(cx, cy)) return { x: cx, y: cy };
    let best = cells[0],
      bd = 1e9;
    for (const c of cells) {
      const d = dist(c[0], c[1], cx, cy);
      if (d < bd) {
        bd = d;
        best = c;
      }
    }
    return { x: best[0], y: best[1] };
  }

  // Sorteia um lugar livre no mapa, longe dos obstáculos da lista 'avoid'.
  function freeSpot(U, m, avoid) {
    for (let i = 0; i < 400; i++) {
      const x = rnd(U.x + m, U.x + U.w - m),
        y = rnd(U.y + m, U.y + U.h - m);
      if (avoid.every(a => dist(x, y, a.x, a.y) > a.r)) return { x, y };
    }
    return { x: rnd(U.x + m, U.x + U.w - m), y: rnd(U.y + m, U.y + U.h - m) };
  }

  // Desenha o barco: casco, vela (enche com a velocidade), bandeira e espuma.
  function drawBoat(b, cargo) {
    if (b.inv > 0 && Math.floor(b.inv * 12) % 2 === 0) return;
    const sp = Math.hypot(b.vx || 0, b.vy || 0);
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.ang);
    if (sp > 30) {
      ctx.strokeStyle = 'rgba(235,248,250,.6)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(13, -10);
      ctx.quadraticCurveTo(26, 0, 13, 10);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    ctx.beginPath();
    ctx.ellipse(3, 4, 21, 11, 0, 0, Math.PI * 2);
    ctx.fill();
    const hg = ctx.createLinearGradient(0, -11, 0, 11);
    hg.addColorStop(0, '#b0723f');
    hg.addColorStop(0.5, '#8a5529');
    hg.addColorStop(1, '#5a3215');
    ctx.fillStyle = hg;
    ctx.strokeStyle = '#2b1709';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(21, 0);
    ctx.bezierCurveTo(14, -11, -6, -12, -15, -9);
    ctx.lineTo(-17, -5);
    ctx.lineTo(-17, 5);
    ctx.lineTo(-15, 9);
    ctx.bezierCurveTo(-6, 12, 14, 11, 21, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#c99a62';
    ctx.beginPath();
    ctx.moveTo(15, 0);
    ctx.bezierCurveTo(10, -7, -5, -8, -12, -6);
    ctx.lineTo(-12, 6);
    ctx.bezierCurveTo(-5, 8, 10, 7, 15, 0);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(90,55,25,.6)';
    ctx.lineWidth = 1;
    for (const y of [-3, 0, 3]) {
      ctx.beginPath();
      ctx.moveTo(-11, y);
      ctx.lineTo(12 - Math.abs(y) * 1.4, y);
      ctx.stroke();
    }
    if (cargo) {
      ctx.fillStyle = cargo;
      ctx.strokeStyle = '#3b230d';
      ctx.lineWidth = 1;
      ctx.fillRect(-12, -4, 7, 8);
      ctx.strokeRect(-12, -4, 7, 8);
      ctx.beginPath();
      ctx.moveTo(-12, 0);
      ctx.lineTo(-5, 0);
      ctx.stroke();
    }
    const bil = Math.min(1, sp / 200) * 4 + 2;
    ctx.strokeStyle = '#4a2c12';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(5, 0);
    ctx.lineTo(-10, 0);
    ctx.stroke();
    ctx.fillStyle = '#f6efdc';
    ctx.strokeStyle = '#b9ad8c';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(5, 0);
    ctx.quadraticCurveTo(-2, -8 - bil, -10, -12);
    ctx.lineTo(-10, 12);
    ctx.quadraticCurveTo(-2, 8 + bil, 5, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = 'rgba(224,176,79,.9)';
    ctx.beginPath();
    ctx.moveTo(-5, -9.5);
    ctx.lineTo(-8, -11);
    ctx.lineTo(-8, 11);
    ctx.lineTo(-5, 9.5);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#3b230d';
    circ(5, 0, 2.8);
    ctx.fill();
    ctx.fillStyle = COL.brass;
    circ(5, 0, 1.4);
    ctx.fill();
    const fw = Math.sin(T * 8) * 1.5;
    ctx.fillStyle = COL.bad;
    ctx.beginPath();
    ctx.moveTo(-16, 0);
    ctx.lineTo(-24, -3 + fw);
    ctx.lineTo(-24, 3 + fw);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  function drawWake() {
    ctx.save();
    for (const w of wake) {
      const a = 1 - w.t;
      ctx.strokeStyle = `rgba(225,244,248,${(0.4 * a).toFixed(3)})`;
      ctx.lineWidth = 1.5;
      circ(w.x, w.y, 4 + w.t * 14);
      ctx.stroke();
      ctx.fillStyle = `rgba(225,244,248,${(0.12 * a).toFixed(3)})`;
      ctx.fill();
    }
    ctx.restore();
  }

  // Cria uma rocha com contorno irregular sorteado.
  function makeRock(x, y, r) {
    const pts = [];
    for (let i = 0; i < 11; i++) pts.push(r * rnd(0.8, 1.08));
    return { x, y, r, pts, seed: rnd(0, 6) };
  }
  function rockPath(k) {
    ctx.beginPath();
    k.pts.forEach((p, i) => {
      const a = (i / k.pts.length) * Math.PI * 2,
        x = Math.cos(a) * p,
        y = Math.sin(a) * p;
      if (i) ctx.lineTo(x, y);
      else ctx.moveTo(x, y);
    });
    ctx.closePath();
  }
  function drawRock(k) {
    ctx.save();
    ctx.translate(k.x, k.y);
    ctx.save();
    ctx.translate(3, 4);
    ctx.fillStyle = 'rgba(0,0,0,.32)';
    rockPath(k);
    ctx.fill();
    ctx.restore();
    const g = ctx.createLinearGradient(-k.r, -k.r, k.r, k.r);
    g.addColorStop(0, '#94a4aa');
    g.addColorStop(0.55, '#5d6b70');
    g.addColorStop(1, '#39444a');
    ctx.fillStyle = g;
    ctx.strokeStyle = '#232c2f';
    ctx.lineWidth = 2;
    rockPath(k);
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = 'rgba(28,36,40,.55)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-k.r * 0.5, -k.r * 0.1);
    ctx.lineTo(k.r * 0.1, k.r * 0.15);
    ctx.lineTo(k.r * 0.45, -k.r * 0.3);
    ctx.moveTo(k.r * 0.1, k.r * 0.15);
    ctx.lineTo(k.r * 0.05, k.r * 0.6);
    ctx.stroke();
    ctx.fillStyle = 'rgba(215,228,232,.55)';
    ctx.beginPath();
    ctx.ellipse(-k.r * 0.3, -k.r * 0.38, k.r * 0.28, k.r * 0.13, -0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(112,156,92,.6)';
    circ(k.r * 0.35, k.r * 0.35, k.r * 0.14);
    ctx.fill();
    circ(k.r * 0.12, k.r * 0.52, k.r * 0.09);
    ctx.fill();
    ctx.restore();
  }

  /*
   * COLISÃO COM ROCHA: se a distância for menor que a soma dos raios, empurra o barco
   * para fora e rebate a velocidade (o barco 'quica'). Devolve true se bateu.
   */
  function rockCollide(b, k) {
    const d = dist(b.x, b.y, k.x, k.y),
      m = b.r + k.r * 0.9;
    if (d < m && d > 0) {
      const nx = (b.x - k.x) / d,
        ny = (b.y - k.y) / d;
      b.x = k.x + nx * m;
      b.y = k.y + ny * m;
      const dot = b.vx * nx + b.vy * ny;
      if (dot < 0) {
        b.vx -= 1.6 * dot * nx;
        b.vy -= 1.6 * dot * ny;
      }
      return true;
    }
    return false;
  }

  // Desenha o redemoinho: centro escuro, espirais e partículas girando.
  function drawWhirl(w) {
    ctx.save();
    ctx.translate(w.x, w.y);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, w.r * 1.15);
    g.addColorStop(0, 'rgba(2,12,20,.9)');
    g.addColorStop(0.45, 'rgba(5,36,52,.5)');
    g.addColorStop(1, 'rgba(5,36,52,0)');
    ctx.fillStyle = g;
    circ(0, 0, w.r * 1.15);
    ctx.fill();
    for (let i = 0; i < 4; i++) {
      ctx.strokeStyle = `rgba(190,235,245,${(0.2 + i * 0.09).toFixed(2)})`;
      ctx.lineWidth = 1.4 + i * 0.4;
      ctx.beginPath();
      for (let a = 0; a < Math.PI * 3.5; a += 0.15) {
        const rr = w.r * (1 - a / (Math.PI * 3.5)) + 2,
          ang = a + T * 2.8 + i * 1.57,
          x = Math.cos(ang) * rr,
          y = Math.sin(ang) * rr;
        if (a) ctx.lineTo(x, y);
        else ctx.moveTo(x, y);
      }
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(235,250,252,.75)';
    for (let i = 0; i < 9; i++) {
      const a = T * (2.2 + i * 0.18) + i * 0.8,
        rr = w.r * (0.28 + ((i * 37) % 62) / 100);
      circ(Math.cos(a) * rr, Math.sin(a) * rr, 1.7);
      ctx.fill();
    }
    ctx.restore();
  }

  // REDEMOINHO: perto dele, o barco é puxado para o centro e empurrado de lado (efeito de giro).
  function whirlPull(b, w, dt) {
    const dx = w.x - b.x,
      dy = w.y - b.y,
      d = Math.hypot(dx, dy),
      R = w.r * 1.6;
    if (d < R && d > 1) {
      const k = 1 - d / R;
      b.vx += ((dx / d) * 350 - (dy / d) * 430) * k * dt;
      b.vy += ((dy / d) * 350 + (dx / d) * 430) * k * dt;
    }
  }

  // Desenha um píer. 'glow' = brilho quando o barco está carregando alguém.
  function drawDock(d, glow) {
    ctx.save();
    ctx.translate(d.x, d.y);
    if (glow) {
      ctx.strokeStyle = 'rgba(224,176,79,.65)';
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);
      ctx.lineDashOffset = -T * 10;
      circ(0, 0, 27 + Math.sin(T * 3) * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    roundRect(-16, -4, 36, 15, 3);
    ctx.fill();
    ctx.fillStyle = '#4b2e14';
    for (const px of [-15, -5, 5, 15]) {
      circ(px, 8, 2.6);
      ctx.fill();
      circ(px, -8, 2.6);
      ctx.fill();
    }
    const g = ctx.createLinearGradient(0, -7, 0, 7);
    g.addColorStop(0, '#b47e47');
    g.addColorStop(1, '#774b22');
    ctx.fillStyle = g;
    ctx.strokeStyle = '#3b230d';
    ctx.lineWidth = 1.6;
    roundRect(-18, -7, 36, 14, 3);
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = 'rgba(59,35,13,.7)';
    ctx.lineWidth = 1;
    for (let i = -12; i <= 12; i += 6) {
      ctx.beginPath();
      ctx.moveTo(i, -7);
      ctx.lineTo(i, 7);
      ctx.stroke();
    }
    ctx.strokeStyle = '#d9c79a';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-15, -8);
    ctx.quadraticCurveTo(-5, -3, 5, -8);
    ctx.stroke();
    ctx.strokeStyle = '#ececec';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(13, -7);
    ctx.lineTo(13, -34);
    ctx.stroke();
    const wv = Math.sin(T * 5) * 2.5;
    ctx.fillStyle = COL.brass;
    ctx.beginPath();
    ctx.moveTo(13, -34);
    ctx.quadraticCurveTo(21, -33 + wv, 29, -29 + wv);
    ctx.quadraticCurveTo(21, -25 + wv, 13, -23);
    ctx.closePath();
    ctx.fill();
    if (d.sign) {
      pill(d.sign, 0, -34 - 12 * UI, '#eaf2ee', 12);
      pill(d.sign2, 0, 12 + 10 * UI, '#c9d3d6', 11);
    }
    ctx.restore();
  }

  // Etiqueta pequena com fundo escuro (usada nos náufragos, pergaminhos e placas).
  function pill(text, x, y, color, size) {
    const fs = (size || 11) * UI,
      hh = fs * 0.82;
    ctx.font = `800 ${fs}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const w = ctx.measureText(text).width + 12 * UI;
    ctx.fillStyle = 'rgba(6,22,31,.88)';
    roundRect(x - w / 2, y - hh, w, hh * 2, hh);
    ctx.fill();
    ctx.fillStyle = color;
    ctx.fillText(text, x, y + 0.5);
  }

  // Etiqueta de cada tipo de náufrago: A = só Ferreiro, B = só Navegante, AB = os dois, N = nenhuma guilda (∅).
  const PLABEL = { A: 'F', B: 'N', AB: 'F+N', N: '∅' };

  // Desenha um náufrago na boia com a cor da(s) guilda(s).
  function drawPassenger(t, x, y) {
    ctx.save();
    ctx.translate(x, y);
    const ring = (col, a0, a1) => {
      ctx.strokeStyle = col;
      ctx.beginPath();
      ctx.arc(0, 0, 10, a0, a1);
      ctx.stroke();
    };
    ctx.lineWidth = 6;
    if (t === 'AB') {
      ring(COL.f, Math.PI / 2, Math.PI * 1.5);
      ring(COL.n, -Math.PI / 2, Math.PI / 2);
    } else ring(t === 'A' ? COL.f : t === 'B' ? COL.n : '#c9d3d6', 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,.85)';
    for (let i = 0; i < 4; i++) {
      const a = (i * Math.PI) / 2 + Math.PI / 4;
      ctx.beginPath();
      ctx.arc(0, 0, 10, a - 0.18, a + 0.18);
      ctx.stroke();
    }
    const wv = Math.sin(T * 6 + x);
    ctx.strokeStyle = '#f2c79b';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-4, -2);
    ctx.lineTo(-9, -10 + wv * 3);
    ctx.moveTo(4, -2);
    ctx.lineTo(9, -10 - wv * 3);
    ctx.stroke();
    ctx.fillStyle = '#f2c79b';
    circ(0, -1, 5.5);
    ctx.fill();
    ctx.fillStyle = '#5a3a22';
    ctx.beginPath();
    ctx.arc(0, -2, 5.7, Math.PI, 0);
    ctx.fill();
    ctx.fillStyle = '#2a1b10';
    circ(-2, -0.3, 0.9);
    ctx.fill();
    circ(2, -0.3, 0.9);
    ctx.fill();
    pill(
      PLABEL[t],
      0,
      -14 - 11 * UI,
      t === 'A' ? COL.f : t === 'B' ? COL.n : t === 'AB' ? COL.brass : '#d8e0e2',
    );
    ctx.restore();
  }

  // Cria um texto que sobe e some (ex.: '+1 em F ∩ N', '−3s').
  function floatText(x, y, text, color) {
    floats.push({ x, y, text, color, t: 0 });
  }
  function drawFloats() {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `800 ${16 * UI}px ${FONT}`;
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(0,0,0,.6)';
    for (const f of floats) {
      ctx.globalAlpha = Math.max(0, 1 - f.t / 1.4);
      const y = f.y - f.t * 32;
      ctx.strokeText(f.text, f.x, y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, y);
    }
    ctx.restore();
  }

  // Fundo animado do menu: três conjuntos e um barco dando voltas.
  function drawMenuBg() {
    const cx = LW / 2,
      cy = LH / 2,
      r = Math.min(LW, LH) * 0.25;
    const P = [
        [-0.6, -0.35],
        [0.6, -0.35],
        [0, 0.6],
      ],
      C = [COL.f, COL.n, COL.a];
    P.forEach((p, i) =>
      drawTerr(
        {
          x: cx + p[0] * r + Math.sin(T * 0.5 + i) * 5,
          y: cy + p[1] * r + Math.cos(T * 0.4 + i) * 5,
          r,
          color: C[i],
        },
        0.55,
      ),
    );
    const a = T * 0.25;
    drawBoat({
      x: cx + Math.cos(a) * r * 1.75,
      y: cy + Math.sin(a) * r * 1.25,
      ang: a + Math.PI / 2,
      inv: 0,
    });
  }

  // ================== FEEDBACK ==================
  const fl = $('#flash');

  // Brilho na borda da tela: 'ok' = verde (acerto), 'bad' = vermelho (erro).

    fl.className = '';
    void fl.offsetWidth;
    fl.className = k;
  }

  // Tremida da tela no erro.
  function shake() {
    if (!reduceMotion) shakeT = 0.35;
  }
  const toastEl = $('#toast');
  let toastTimer = 0;

  // Mensagem do Mestre Paulo Henrique no topo da tela (explicação do erro ou elogio).

  // ================== TELAS ==================

  // Monta as alternativas: a resposta certa + os erros típicos (ds), completa com números próximos e embaralha.
  function mkOpts(correct, ds, n) {
    n = n || 4;
    const s = [correct];
    for (const d of ds) {
      if (Number.isFinite(d) && d >= 0 && !s.includes(d) && s.length < n) s.push(d);
    }
    let g = 0;
    while (s.length < n && g < 80) {
      const c = correct + ri(-6, 6);
      if (c >= 0 && !s.includes(c)) s.push(c);
      g++;
    }
    return shuffle(s);
  }

  // Cria uma pergunta de múltipla escolha com a resposta certa e a explicação.
  function mkQ(q, correct, ds, expl) {
    const o = mkOpts(correct, ds);
    return { q, opts: o.map(String), correct: o.indexOf(correct), expl };
  }

    );

      const i = +arg,
        ok = i === q.correct;
      scr.querySelectorAll('.opt').forEach((b, j) => {
        b.disabled = true;
        if (j === q.correct) b.classList.add('right');
        else if (j === i) b.classList.add('wrong');
      });
      const fb = $('#fb');

      fb.innerHTML = `<strong>${ok ? 'Isso mesmo, meninos!' : 'Quase, meninos!'}</strong> ${q.expl}<div class="row end"><button class="btn primary" data-act="qNext">Continuar</button></div>`;
      fb.querySelector('button').focus();
      if (ok) {
        SFX.ok();
        flash('ok');
      } else {
        SFX.bad();
        flash('bad');
        shake();
      }
      ACT.qNext = () => {
        hideScreen();
        done(ok);
      };
    };
  }
