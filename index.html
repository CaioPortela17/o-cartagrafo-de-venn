   * FASE 1 — RESGATE (cardinalidade e regiões)
   * Náufragos de 4 tipos (só F, só N, F e N, nenhuma) devem ir ao píer da região certa.
   * O contador 'counts' monta o censo, e no fim o jogador responde n(F), n(F ∪ N) e 'nenhuma'
   * com os números que ele mesmo montou.
   *
   * TODAS AS FASES SEGUEM O MESMO MOLDE (objeto P):
   *   P.intro / P.outro -> falas do Mestre antes e depois
   *   P.init()          -> monta o mapa
   *   P.update(dt)      -> lógica de um quadro (movimento, colisões, acertos e erros)
   *   P.draw()          -> desenha no canvas
   *   P.hud()           -> atualiza o painel de cima
   */
  function Phase1() {
    const P = { name: 'Fase 1 · Resgate', errors: 0, time: 130, delivered: 0, total: 0 };
    P.intro = [
      'Fase 1, o Resgate. A tempestade jogou moradores no mar! Cada náufrago tem uma etiqueta dizendo a que guilda pertence.',
      'Encoste o barco num náufrago para pegá-lo e leve até o <b>píer da região certa</b> do diagrama. Os píeres de dentro dos territórios não têm nome: você precisa saber pela posição.',
      '<b class="tf">F</b> = só Ferreiro: vai para o território F, fora da interseção. <b class="tn">N</b> = só Navegante. <b>F+N</b> = Ferreiro e Navegante: fica onde os territórios se cruzam, a interseção <span class="formula">F ∩ N</span>. <b>∅</b> = sem guilda: vai para o píer do canto, com a placa <b>Sem guilda</b>, fora dos dois territórios.',
      'Controles: setas ou W A S D. No celular, toque e segure onde quer que o barco vá. Cada batida numa rocha custa 3 segundos, e os redemoinhos puxam o barco. Você tem 130 segundos.',
      'Fique de olho no painel lá em cima: <span class="formula">n(F)</span> conta <b>todos</b> os Ferreiros, inclusive os que também são Navegantes. No final eu vou te fazer perguntas sobre o censo. Vai lá, meninos!',
    ];
    P.outro = [
      'Excelente, meninos! O primeiro registro do censo está pronto. Percebeu? Quem está na interseção entra na conta de F <b>e</b> na conta de N.',
      'É por isso que, para contar a união sem repetir ninguém, precisamos descontar a interseção uma vez. No Corredor dos Portões você vai usar essa ideia, só que bem mais rápido.',
    ];
    const LONG = { A: 'só Ferreiro', B: 'só Navegante', AB: 'Ferreiro e Navegante', N: 'sem guilda' };
    const REG = { A: 'F − N', B: 'N − F', AB: 'F ∩ N', N: '(F ∪ N)ᶜ' };
    const EXPL = {
      A: 'Esse morador é <b>só Ferreiro</b>: o lugar dele é o território F, fora da interseção (F − N).',
      B: 'Esse morador é <b>só Navegante</b>: o lugar dele é o território N, fora da interseção (N − F).',
      AB: 'Esse morador é <b>Ferreiro e Navegante</b>: o lugar dele é onde os territórios se cruzam (F ∩ N).',
      N: 'Esse morador <b>não tem guilda</b>: o lugar dele é fora dos dois territórios, no complemento (F ∪ N)ᶜ.',
    };
    let U,
      A,
      B,
      b,
      docks,
      rocks,
      whirls,
      pass,
      carry = null,
      hl = null;
    const counts = { A: 0, B: 0, AB: 0, N: 0 };
    // Pertence ao conjunto = distância até o centro menor que o raio.
    const inA = (x, y) => dist(x, y, A.x, A.y) < A.r,
      inB = (x, y) => dist(x, y, B.x, B.y) < B.r;
    // Teste de cada região do Venn (lógica booleana).
    const TEST = {
      A: (x, y) => inA(x, y) && !inB(x, y),
      B: (x, y) => inB(x, y) && !inA(x, y),
      AB: (x, y) => inA(x, y) && inB(x, y),
      N: (x, y) => !inA(x, y) && !inB(x, y),
    };
    function spot() {
      return freeSpot(U, 30, [
        ...docks.map(d => ({ x: d.x, y: d.y, r: 60 })),
        { x: b.x, y: b.y, r: 80 },
        ...rocks.map(k => ({ x: k.x, y: k.y, r: k.r + 30 })),
        ...whirls.map(w => ({ x: w.x, y: w.y, r: w.r + 40 })),
        ...pass.filter(p => !p.done).map(p => ({ x: p.hx, y: p.hy, r: 40 })),
      ]);
    }
    P.init = () => {
      const land = LW >= LH;
      U = { x: 16, y: 16, w: LW - 32, h: LH - 32 };
      const r = land ? LH * 0.31 : LW * 0.31,
        d = r * 1.2,
        cx = LW / 2,
        cy = LH / 2,
        ax = land ? 1 : 0,
        ay = land ? 0 : 1;
      A = { x: cx - (ax * d) / 2, y: cy - (ay * d) / 2, r, color: COL.f, name: 'Ferreiros · F' };
      B = { x: cx + (ax * d) / 2, y: cy + (ay * d) / 2, r, color: COL.n, name: 'Navegantes · N' };
      A.lx = A.x;
      A.ly = A.y - r + 24;
      B.lx = B.x;
      B.ly = land ? B.y - r + 24 : B.y + r - 24;
      docks = [
        { t: 'A', x: A.x - ax * r * 0.55, y: A.y - ay * r * 0.55 },
        { t: 'AB', x: cx, y: cy },
        { t: 'B', x: B.x + ax * r * 0.55, y: B.y + ay * r * 0.55 },
        {
          t: 'N',
          x: U.x + U.w - Math.max(46, 62 * UI),
          y: U.y + U.h - 40,
          sign: '∅ Sem guilda',
          sign2: 'fora de F e de N',
        },
      ];
      const tp = (x, y) => (land ? { x, y } : { x: y, y: x });
      const s0 = tp(66, 534);
      b = Boat(s0.x, s0.y);
      rocks = P1_ROCKS.map(([x, y, rr]) => {
        const q = tp(x, y);
        return makeRock(q.x, q.y, rr);
      });
      whirls = P1_WHIRLS.map(([x, y, rr]) => {
        const q = tp(x, y);
        return { x: q.x, y: q.y, r: rr };
      });
      const types = [];
      const add = (t, n) => {
        for (let i = 0; i < n; i++) types.push(t);
      };
      add('A', ri(2, 3));
      add('AB', ri(2, 3));
      add('B', ri(2, 3));
      add('N', ri(1, 2));
      pass = [];
      for (const t of shuffle(types)) {
        const s = spot();
        pass.push({ t, hx: s.x, hy: s.y, x: s.x, y: s.y, ph: rnd(0, 6.28), done: false });
      }
      P.total = pass.length;
    };
    // Entrega no píer: se o tipo do náufrago = tipo do píer, conta no censo; senão, explica e acende a região certa.
    function deliver(d) {
      const p = carry;
      carry = null;
      if (p.t === d.t) {
        p.done = true;
        counts[p.t]++;
        P.delivered++;
        SFX.ok();
        flash('ok');
        floatText(d.x, d.y - 38, '+1 em ' + REG[p.t], COL.ok);
        elogioRaro();
        if (P.delivered >= P.total) {
          P.hud();
          state = 'wait';
          setTimeout(questions, 600);
        }
      } else {
        P.errors++;
        SFX.bad();
        flash('bad');
        shake();
        toast(EXPL[p.t] + ' A região certa está acesa no mapa.', 3600);
        hl = { t: 2.4, test: TEST[p.t] };
        const s = spot();
        p.hx = s.x;
        p.hy = s.y;
        p.x = s.x;
        p.y = s.y;
      }
    }
    // Perguntas do fim da fase, calculadas com os números que o jogador montou.
    function questions() {
      const a = counts.A,
        bb = counts.B,
        ab = counts.AB,
        n = counts.N,
        nf = a + ab,
        nn = bb + ab,
        un = a + bb + ab,
        tot = un + n;
      askSeq(
        [
          mkQ(
            `Pelo censo que você acabou de montar: quantos moradores pertencem aos Ferreiros? Ou seja, quanto vale <b>n(F)</b>?`,
            nf,
            [a, ab, nf + bb],
            `n(F) conta todos que estão no território F: os ${a} que são só Ferreiros mais os ${ab} da interseção, total ${nf}.`,
          ),
          mkQ(
            `Quantos moradores pertencem a pelo menos uma guilda? Ou seja, quanto vale <b>n(F ∪ N)</b>?`,
            un,
            [nf + nn, un + n, a + bb],
            `n(F ∪ N) = n(F) + n(N) − n(F ∩ N) = ${nf} + ${nn} − ${ab} = ${un}. A interseção é descontada uma vez porque foi contada duas.`,
          ),
          mkQ(
            `Você resgatou ${tot} moradores no total. Quantos <b>não</b> pertencem a nenhuma das duas guildas?`,
            n,
            [tot - nf, tot - nn, ab],
            `Nenhuma guilda = n(U) − n(F ∪ N) = ${tot} − ${un} = ${n}.`,
          ),
        ],
        errs => {
          P.errors += errs;
          finishPhase(P.errors);
        },
      );
    }
    P.update = dt => {
      P.time -= dt;
      if (P.time <= 0) {
        failPhase('O tempo acabou!');
        return;
      }
      steer(b, dt, U);
      whirls.forEach(w => whirlPull(b, w, dt));
      for (const k of rocks)
        if (rockCollide(b, k) && b.hitCd <= 0) {
          SFX.hit();
          b.hitCd = 0.6;
          P.time -= 3;
          floatText(b.x, b.y - 24, '−3s', COL.bad);
          shake();
        }
      for (const p of pass) {
        if (p.done || p === carry) continue;
        p.x = p.hx + Math.sin(T * 0.7 + p.ph) * 8;
        p.y = p.hy + Math.cos(T * 0.9 + p.ph) * 6;
        if (!carry && dist(b.x, b.y, p.x, p.y) < b.r + 13) {
          carry = p;
          SFX.pick();
          floatText(p.x, p.y - 26, PLABEL[p.t] + ' a bordo', COL.ink);
        }
      }
      if (carry) {
        for (const d of docks)
          if (dist(b.x, b.y, d.x, d.y) < 30) {
            deliver(d);
            break;
          }
      }
      if (hl) {
        hl.t -= dt;
        if (hl.t <= 0) hl = null;
      }
      P.hud();
    };
    P.draw = () => {
      drawU(U, 'U = Reino de Venn');
      if (hl) fillRegion(U, hl.test, COL.brass, 0.35 * Math.min(1, hl.t));
      drawTerr(A);
      drawTerr(B);
      whirls.forEach(drawWhirl);
      rocks.forEach(drawRock);
      docks.forEach(d => drawDock(d, !!carry));
      for (const p of pass) if (!p.done && p !== carry) drawPassenger(p.t, p.x, p.y);
      drawWake();
      drawBoat(b);
      if (carry) drawPassenger(carry.t, b.x - Math.cos(b.ang) * 20, b.y - Math.sin(b.ang) * 20);
      drawLabel(A);
      drawLabel(B);
    };
    P.hud = () => {
      setTimer(P.time);
      setLives(0, 0);
      setInfo(
        `<div class="stats"><span class="tf">n(F) = ${counts.A + counts.AB}</span><span class="tn">n(N) = ${counts.B + counts.AB}</span><span>n(F ∩ N) = ${counts.AB}</span><span>sem guilda = ${counts.N}</span><span class="dim">resgatados ${P.delivered}/${P.total}</span></div><div class="sub2">${carry ? `A bordo: <b>${PLABEL[carry.t]}</b>, ${LONG[carry.t]}. Leve até o píer da região certa.` : 'Encoste o barco num náufrago para resgatá-lo.'}</div>`,
      );
    };
    return P;
  }

  // ================== FASE 2: CORREDOR DOS PORTÕES ==================

  /*
   * FASE 2 — gera uma conta com números sorteados e calcula o GABARITO PELA FÓRMULA.
   *   t = 0 -> n(F ∪ N) = a + b − i
   *   t = 1 -> n(F ∩ N) = a + b − u
   *   t = 2 -> só F = a − i
   *   t = 3 -> nenhuma = total − (a + b − i)
   * 'ds' são os erros típicos que viram alternativas (ex.: a + b, esquecendo de tirar a interseção).
   */
  function genQ2(t) {
    const a = ri(12, 30),
      b = ri(10, 25),
      i = ri(3, Math.min(a, b) - 3),
      u = a + b - i;
    if (t === 0)
      return {
        text: `n(F) = ${a}, n(N) = ${b} e n(F ∩ N) = ${i}. Quanto vale <b>n(F ∪ N)</b>?`,
        ans: u,
        ds: [a + b, u + i, a + b - 2 * i],
        expl: `n(F ∪ N) = ${a} + ${b} − ${i} = ${u}.`,
      };
    if (t === 1)
      return {
        text: `n(F) = ${a}, n(N) = ${b} e n(F ∪ N) = ${u}. Quanto vale <b>n(F ∩ N)</b>?`,
        ans: i,
        ds: [u - a, u - b, i + 2],
        expl: `n(F ∩ N) = n(F) + n(N) − n(F ∪ N) = ${a} + ${b} − ${u} = ${i}.`,
      };
    if (t === 2)
      return {
        text: `n(F) = ${a} e n(F ∩ N) = ${i}. Quantos são <b>só Ferreiros</b>, n(F − N)?`,
        ans: a - i,
        ds: [a + i, a, i],
        expl: `Só F = n(F) − n(F ∩ N) = ${a} − ${i} = ${a - i}.`,
      };
    const tot = u + ri(4, 15);
    return {
      text: `O reino tem ${tot} moradores. n(F) = ${a}, n(N) = ${b} e n(F ∩ N) = ${i}. Quantos <b>não são de nenhuma</b> das duas guildas?`,
      ans: tot - u,
      ds: [tot - a - b, tot - u + i, tot - u - i],
      expl: `Nenhuma = ${tot} − (${a} + ${b} − ${i}) = ${tot} − ${u} = ${tot - u}.`,
    };
  }

  /*
   * FASE 2 — CORREDOR DOS PORTÕES (inclusão-exclusão com 2 conjuntos)
   * O barco anda sozinho para cima; o jogador só vai para os lados e passa pelo portão da resposta certa.
   * O portão escolhido é a faixa onde o barco está: Math.floor(b.x / (LW / 3)) -> 0, 1 ou 2.
   */
  function Phase2() {
    const P = { name: 'Fase 2 · Corredor dos Portões', errors: 0, lives: 3, scroll: 0 };
    P.intro = [
      'Fase 2, o Corredor dos Portões. Para chegar à próxima região, o barco precisa atravessar um canal cheio de portões.',
      'Lá em cima aparece uma conta sobre os conjuntos F (Ferreiros) e N (Navegantes). Cada portão traz um número: passe pelo portão com a <b>resposta certa</b>.',
      'A regra de ouro é o <b>Princípio da Inclusão e Exclusão</b>: <span class="formula">n(F ∪ N) = n(F) + n(N) − n(F ∩ N)</span> A interseção é descontada porque foi contada duas vezes: uma em F e outra em N.',
      'Também vão aparecer estas: <span class="formula">só F = n(F) − n(F ∩ N)</span> e <span class="formula">nenhuma = total − n(F ∪ N)</span>',
      'O barco anda sozinho. Use ← → (ou A e D), ou toque no lado para onde quer ir. Rochas e portões errados custam um coração, e os redemoinhos puxam o barco para o lado. São 7 portões, e a correnteza acelera a cada um. Vamos lá, meninos!',
    ];
    P.outro = [
      'Boa, 06! Vocês atravessaram o corredor! Agora a fórmula da inclusão-exclusão já está na ponta da língua.',
      'Mas a próxima região está coberta de neblina. Lá você não vai poder confiar nos olhos, só no que sabe sobre as regiões do diagrama.',
    ];
    let b,
      rows = [],
      rocks = [],
      whirls = [],
      spawned = 0,
      speed,
      freeze = 0,
      cur = null,
      nextIn = null,
      endIn = null,
      types;
    const total = 7;
    P.init = () => {
      b = Boat(LW / 2, LH - 70);
      b.ang = -Math.PI / 2;
      speed = LH / 9.5;
      types = shuffle([0, 0, 1, 1, 2, 3, 3]);
      spawnRow();
    };
    // Cria a próxima fileira de 3 portões com a conta, as rochas e o redemoinho daquele portão.
    function spawnRow() {
      const q = genQ2(types[spawned % types.length]);
      const vals = mkOpts(q.ans, q.ds, 3);
      rows.push({ y: -40 - LH * 0.75, vals, correct: vals.indexOf(q.ans), q, res: false, pick: -1 });
      cur = rows[rows.length - 1];
      spawned++;
      const pat = P2_PATTERNS[(spawned - 1) % P2_PATTERNS.length];
      pat.rocks.forEach(([fx, fy]) => rocks.push(makeRock(fx * LW, -30 - fy * LH, 17)));
      if (pat.whirl) whirls.push({ x: pat.whirl[0] * LW, y: -30 - pat.whirl[1] * LH, r: 40 });
    }
    function hurt() {
      P.lives--;
      b.inv = 1.5;
      SFX.hit();
      shake();
      flash('bad');
      if (P.lives <= 0) failPhase('O barco não resistiu à correnteza.');
    }
    P.update = dt => {
      steer(b, dt, { x: 0, y: 0, w: LW, h: LH }, { lockY: true, fixedAng: true, max: 340, acc: 1600 });
      b.y = LH - 70;
      b.ang = -Math.PI / 2;
      let dy = 0;
      if (freeze > 0) freeze -= dt;
      else dy = speed * dt;
      P.scroll += dy;
      rows.forEach(r => (r.y += dy));
      rocks.forEach(k => (k.y += dy));
      whirls.forEach(w => {
        w.y += dy;
        whirlPull(b, w, dt);
      });
      wake.forEach(w => (w.y += dy));
      if (dy > 0 && Math.random() < dt * 25) wake.push({ x: b.x + rnd(-4, 4), y: b.y + 16, t: 0 });
      for (const k of rocks)
        if (b.inv <= 0 && dist(b.x, b.y, k.x, k.y) < b.r + k.r * 0.85) {
          hurt();
          if (state !== 'play') return;
        }
      for (const r of rows) {
        if (!r.res && r.y >= b.y) {
          r.res = true;
          // Em qual dos 3 portões o barco passou (0 = esquerda, 1 = meio, 2 = direita).
          const lane = clamp(Math.floor(b.x / (LW / 3)), 0, 2);
          r.pick = lane;
          if (lane === r.correct) {
            SFX.ok();
            flash('ok');
            floatText(b.x, b.y - 36, 'Portão certo!', COL.ok);
            elogioRaro();
            speed = Math.min(speed * 1.04, LH / 7.5);
          } else {
            P.errors++;
            P.lives--;
            SFX.bad();
            flash('bad');
            shake();
            toast(`<b>A resposta certa era ${r.vals[r.correct]}.</b> ${r.q.expl}`, 3600);
            freeze = 2.6;
            if (P.lives <= 0) {
              failPhase('O barco não resistiu à correnteza.');
              return;
            }
          }
          if (spawned < total) nextIn = 0.6;
          else endIn = 1.4;
        }
      }
      if (nextIn != null && freeze <= 0) {
        nextIn -= dt;
        if (nextIn <= 0) {
          nextIn = null;
          spawnRow();
        }
      }
      if (endIn != null) {
        endIn -= dt;
        if (endIn <= 0) {
          endIn = null;
          finishPhase(P.errors);
          return;
        }
      }
      rows = rows.filter(r => r.y < LH + 90);
      rocks = rocks.filter(k => k.y < LH + 60);
      whirls = whirls.filter(w => w.y < LH + 80);
      P.hud();
    };
    function drawRow(r) {
      const w = LW / 3;
      for (let i = 0; i < 3; i++) {
        const lx = w * (i + 0.5),
          half = w * 0.4;
        let stroke = COL.brass,
          fill = 'rgba(6,22,31,.9)';
        if (r.res) {
          if (i === r.correct) {
            stroke = COL.ok;
            fill = 'rgba(18,72,46,.95)';
          } else if (i === r.pick) {
            stroke = COL.bad;
            fill = 'rgba(84,20,26,.95)';
          }
        }
        ctx.strokeStyle = 'rgba(234,242,238,.55)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(lx - half, r.y);
        ctx.lineTo(lx + half, r.y);
        ctx.stroke();
        for (const s of [-1, 1]) {
          ctx.fillStyle = '#e9eef0';
          circ(lx + s * half, r.y, 9);
          ctx.fill();
          ctx.fillStyle = COL.bad;
          ctx.beginPath();
          ctx.arc(lx + s * half, r.y, 9, 0, Math.PI);
          ctx.fill();
        }
        const bw = Math.min(half * 1.3, 116),
          bh = 36;
        ctx.fillStyle = fill;
        ctx.strokeStyle = stroke;
        ctx.lineWidth = 2.5;
        roundRect(lx - bw / 2, r.y - bh - 10, bw, bh, 9);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = COL.ink;
        ctx.font = `800 ${23 * Math.min(UI, 1.35)}px ${FONT}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(r.vals[i], lx, r.y - bh / 2 - 9);
      }
    }
    P.draw = () => {
      ctx.save();
      ctx.strokeStyle = 'rgba(224,176,79,.16)';
      ctx.setLineDash([14, 14]);
      ctx.lineDashOffset = -P.scroll;
      ctx.lineWidth = 2;
      for (let i = 1; i < 3; i++) {
        const x = (LW * i) / 3;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, LH);
        ctx.stroke();
      }
      ctx.restore();
      ctx.fillStyle = 'rgba(224,200,140,.12)';
      ctx.fillRect(0, 0, 7, LH);
      ctx.fillRect(LW - 7, 0, 7, LH);
      whirls.forEach(drawWhirl);
      rocks.forEach(drawRock);
      rows.forEach(drawRow);
      drawWake();
      drawBoat(b);
    };
    P.hud = () => {
      setLives(P.lives, 3);
      setTimer(null);
      const head = `<div class="eyebrow">Portão ${spawned} de ${total}</div>`;
      setInfo(
        head +
          (cur && !cur.res
            ? `<div class="qline">${cur.q.text}</div>`
            : `<div class="qline dim">${endIn != null ? 'Fim do corredor!' : 'Prepare-se para o próximo portão…'}</div>`),
      );
    };
    return P;
  }

  // ================== FASE 3: NEBLINA ==================

  /*
   * FASE 3 — NEBLINA (regiões, complemento e notação)
   * Cada missão tem um teste de região (ex.: N − A -> n && !a). Ao soltar a carga,
   * o código testa se a posição do barco passa no teste daquela missão.
   */
  function Phase3() {
    const P = { name: 'Fase 3 · Neblina', errors: 0, lives: 3 };
    P.intro = [
      'Fase 3, a Neblina. Aqui vivem <b class="tn">Navegantes (N)</b> e <b class="ta">Alquimistas (A)</b>. A névoa cobriu tudo e você só enxerga perto do barco.',
      'Cada missão pede para entregar suprimentos a um grupo de moradores. Navegue até a região certa do diagrama e solte a carga com <b>ESPAÇO</b> ou com o botão <b>Soltar carga</b>.',
      'Leia a notação com cuidado: <span class="formula">N − A</span> é só N, fora da interseção. <span class="formula">N ∩ A</span> é a interseção. <span class="formula">N ∪ A</span> é qualquer ponto dentro de pelo menos um território. <span class="formula">Aᶜ</span> é o complemento de A: tudo que está fora de A.',
      'As bordas dos territórios brilham de leve na névoa: use-as para se guiar. Rochas e redemoinhos estão escondidos na névoa: cada batida tira 2 segundos. Cada missão tem 20 segundos, e cada erro custa um coração. Atenção, meninos!',
    ];
    P.outro = [
      'Isso aí, meninos! A névoa baixou e vocês não se perderam! A diferença entre "N" e "só N" é a que mais confunde os estudantes, e vocês dominaram.',
      'Agora vem o mais difícil: o Templo das Três Guildas, onde os três territórios se cruzam ao mesmo tempo.',
    ];
    const POOL = [
      {
        txt: 'quem é só Navegante',
        nota: 'N − A',
        test: (n, a) => n && !a,
        expl: 'N − A é a parte do território N que fica fora de A.',
      },
      {
        txt: 'quem é só Alquimista',
        nota: 'A − N',
        test: (n, a) => a && !n,
        expl: 'A − N é a parte do território A que fica fora de N.',
      },
      {
        txt: 'quem é Navegante e Alquimista',
        nota: 'N ∩ A',
        test: (n, a) => n && a,
        expl: 'N ∩ A é a região onde os dois territórios se cruzam.',
      },
      {
        txt: 'quem não é de nenhuma das duas guildas',
        nota: '(N ∪ A)ᶜ',
        test: (n, a) => !n && !a,
        expl: '(N ∪ A)ᶜ é tudo que está fora dos dois territórios.',
      },
      {
        txt: 'qualquer Navegante',
        nota: 'N',
        test: (n, a) => n,
        expl: 'N é o território N inteiro, incluindo a interseção com A.',
      },
      {
        txt: 'quem não é Alquimista',
        nota: 'Aᶜ',
        test: (n, a) => !a,
        expl: 'Aᶜ é tudo que está fora de A: o "só N" e a região sem guilda.',
      },
      {
        txt: 'quem é Navegante ou Alquimista',
        nota: 'N ∪ A',
        test: (n, a) => n || a,
        expl: 'N ∪ A é qualquer ponto dentro de pelo menos um dos dois territórios.',
      },
    ];
    let U,
      N,
      A,
      b,
      rocks,
      whirls,
      missions,
      mi = 0,
      mt = 20,
      hl = null,
      lift = 0,
      lock = 0,
      endIn = null;
    const inN = (x, y) => dist(x, y, N.x, N.y) < N.r,
      inA = (x, y) => dist(x, y, A.x, A.y) < A.r;
    P.init = () => {
      const land = LW >= LH;
      U = { x: 16, y: 16, w: LW - 32, h: LH - 32 };
      const r = land ? LH * 0.31 : LW * 0.31,
        d = r * 1.2,
        cx = LW / 2,
        cy = LH / 2,
        ax = land ? 1 : 0,
        ay = land ? 0 : 1;
      N = { x: cx - (ax * d) / 2, y: cy - (ay * d) / 2, r, color: COL.n, name: 'Navegantes · N' };
      A = { x: cx + (ax * d) / 2, y: cy + (ay * d) / 2, r, color: COL.a, name: 'Alquimistas · A' };
      N.lx = N.x;
      N.ly = N.y - r + 24;
      A.lx = A.x;
      A.ly = land ? A.y - r + 24 : A.y + r - 24;
      const tp = (x, y) => (land ? { x, y } : { x: y, y: x });
      const s0 = tp(66, 534);
      b = Boat(s0.x, s0.y);
      rocks = P3_ROCKS.map(([x, y, rr]) => {
        const q = tp(x, y);
        return makeRock(q.x, q.y, rr);
      });
      whirls = P3_WHIRLS.map(([x, y, rr]) => {
        const q = tp(x, y);
        return { x: q.x, y: q.y, r: rr };
      });
      missions = shuffle(POOL).slice(0, 6);
      hud.act.hidden = false;
      hud.act.textContent = 'Soltar carga';
    };
    P.action = () => {
      if (state !== 'play' || lock > 0 || endIn != null) return;
      check(false);
    };
    // Confere a entrega: testa a posição do barco com o teste da região da missão.
    function check(timeout) {
      const m = missions[mi];
      const test = (x, y) => m.test(inN(x, y), inA(x, y));
      const ok = !timeout && test(b.x, b.y);
      if (ok) {
        SFX.ok();
        flash('ok');
        floatText(b.x, b.y - 30, 'Entregue em ' + m.nota, COL.ok);
        elogioRaro();
        hl = { test, t: 1.6, color: COL.ok };
      } else {
        P.errors++;
        P.lives--;
        SFX.bad();
        flash('bad');
        shake();
        toast(
          `<b>${timeout ? 'O tempo acabou.' : 'Ali não é ' + m.nota + '.'}</b> ${m.expl} A região certa está acesa no mapa.`,
          3800,
        );
        hl = { test, t: 2.8, color: COL.brass };
        if (P.lives <= 0) {
          failPhase('A névoa venceu desta vez.');
          return;
        }
      }
      mi++;
      mt = 20;
      lock = 0.4;
      if (mi >= missions.length) {
        endIn = 1.8;
        hud.act.hidden = true;
      }
    }
    P.update = dt => {
      if (hl) {
        hl.t -= dt;
        if (hl.t <= 0) hl = null;
      }
      lift += ((hl ? 1 : 0) - lift) * Math.min(1, dt * 6);
      if (endIn != null) {
        endIn -= dt;
        P.hud();
        if (endIn <= 0) {
          endIn = null;
          finishPhase(P.errors);
        }
        return;
      }
      lock -= dt;
      mt -= dt;
      if (mt <= 0) {
        check(true);
        if (state !== 'play') return;
      }
      steer(b, dt, U);
      whirls.forEach(w => whirlPull(b, w, dt));
      for (const k of rocks)
        if (rockCollide(b, k) && b.hitCd <= 0) {
          SFX.hit();
          b.hitCd = 0.6;
          shake();
          mt -= 2;
          floatText(b.x, b.y - 24, '−2s', COL.bad);
        }
      P.hud();
    };
    P.draw = () => {
      drawU(U, 'U = Mar da Neblina');
      drawTerr(N);
      drawTerr(A);
      whirls.forEach(drawWhirl);
      rocks.forEach(drawRock);
      drawWake();
      drawBoat(b, COL.brass);
      const fa = 0.95 * (1 - lift);
      if (fa > 0.01) {
        const g = ctx.createRadialGradient(b.x, b.y, 42, b.x, b.y, 125);
        g.addColorStop(0, 'rgba(4,14,20,0)');
        g.addColorStop(1, `rgba(4,14,20,${fa.toFixed(3)})`);
        ctx.fillStyle = g;
        ctx.fillRect(-LW, -LH, LW * 3, LH * 3);
      }
      if (hl) fillRegion(U, hl.test, hl.color, 0.42 * Math.min(1, hl.t));
      ctx.save();
      ctx.globalAlpha = 0.3 + 0.1 * Math.sin(T * 2);
      ctx.lineWidth = 2;
      for (const c of [N, A]) {
        ctx.strokeStyle = c.color;
        circ(c.x, c.y, c.r);
        ctx.stroke();
      }
      ctx.restore();
      drawLabel(N, 0.8);
      drawLabel(A, 0.8);
    };
    P.hud = () => {
      setLives(P.lives, 3);
      setTimer(endIn != null ? null : mt);
      if (endIn != null) {
        setInfo(
          '<div class="eyebrow">Missões concluídas</div><div class="qline">Todas as entregas foram feitas!</div>',
        );
        return;
      }
      const m = missions[mi];
      setInfo(
        `<div class="eyebrow">Missão ${mi + 1} de ${missions.length}</div><div class="qline">Entregue suprimentos para <b>${m.txt}</b> <span class="formula">${m.nota}</span></div>`,
      );
    };
    return P;
  }

  // ================== FASE 4: TEMPLO DAS TRÊS GUILDAS ==================

  // Fase 4: três conjuntos de dados possíveis (sorteia um por partida).
  const VARS = [
    { F: 50, N: 40, A: 30, FN: 15, FA: 10, NA: 8, FNA: 5, tot: 100 },
    { F: 35, N: 28, A: 22, FN: 10, FA: 8, NA: 6, FNA: 3, tot: 80 },
    { F: 42, N: 36, A: 30, FN: 12, FA: 9, NA: 7, FNA: 4, tot: 100 },
  ];

  /*
   * FASE 4 — TEMPLO DAS TRÊS GUILDAS (inclusão-exclusão com 3 conjuntos)
   * 7 pergaminhos, um em cada região do Venn de 3 círculos. No fim:
   *   n(F ∪ N ∪ A) = n(F) + n(N) + n(A) − n(F∩N) − n(F∩A) − n(N∩A) + n(F∩N∩A)
   */
  function Phase4() {
    const D = VARS[ri(0, VARS.length - 1)];
    const P = { name: 'Fase 4 · Templo das Três Guildas', errors: 0, lives: 3 };
    P.intro = [
      'Fase 4, o Templo das Três Guildas. Aqui os três territórios se cruzam: <b class="tf">Ferreiros (F)</b>, <b class="tn">Navegantes (N)</b> e <b class="ta">Alquimistas (A)</b>.',
      `O reino tem <b>${D.tot} moradores</b>. As outras sete informações do censo estão em pergaminhos espalhados pelo mapa, cada um dentro da região a que se refere.`,
      'Com três conjuntos, a inclusão-exclusão ganha mais passos: <span class="formula">n(F ∪ N ∪ A) = n(F) + n(N) + n(A) − n(F ∩ N) − n(F ∩ A) − n(N ∩ A) + n(F ∩ N ∩ A)</span>',
      'Por que somar o centro no final? Quem está nas três guildas é somado 3 vezes nos conjuntos e descontado 3 vezes nas interseções. Sem a última parcela, ele ficaria de fora da conta.',
      'Cuidado com as serpentes marinhas que patrulham os territórios: encostar em uma custa um coração. Junte os 7 pergaminhos e responda às minhas perguntas. Foco, 06!',
    ];
    P.outro = [
      'O censo está completo, meninos! Ferreiros, Navegantes e Alquimistas, todos contados e ninguém repetido.',
      'Só falta uma coisa: a Névoa do Caos descobriu que o censo voltou e veio atrás de você. Prepare-se para a batalha final!',
    ];
    let U,
      F,
      N,
      A,
      b,
      clues,
      serp,
      endIn = null,
      got = 0;
    const iF = (x, y) => dist(x, y, F.x, F.y) < F.r,
      iN = (x, y) => dist(x, y, N.x, N.y) < N.r,
      iA = (x, y) => dist(x, y, A.x, A.y) < A.r;
    P.init = () => {
      const land = LW >= LH;
      U = { x: 16, y: 16, w: LW - 32, h: LH - 32 };
      const r = land ? LH * 0.27 : LW * 0.28,
        cx = LW / 2,
        cy = LH / 2 + (land ? 10 : 0);
      F = { x: cx - r * 0.6, y: cy - r * 0.38, r, color: COL.f, name: 'Ferreiros · F' };
      N = { x: cx + r * 0.6, y: cy - r * 0.38, r, color: COL.n, name: 'Navegantes · N' };
      A = { x: cx, y: cy + r * 0.6, r, color: COL.a, name: 'Alquimistas · A' };
      F.lx = F.x - r * 0.35;
      F.ly = F.y - r + 26;
      N.lx = N.x + r * 0.35;
      N.ly = N.y - r + 26;
      A.lx = A.x;
      A.ly = A.y + r - 22;
      const defs = [
        ['n(F)', D.F, (x, y) => iF(x, y) && !iN(x, y) && !iA(x, y)],
        ['n(N)', D.N, (x, y) => iN(x, y) && !iF(x, y) && !iA(x, y)],
        ['n(A)', D.A, (x, y) => iA(x, y) && !iF(x, y) && !iN(x, y)],
        ['n(F ∩ N)', D.FN, (x, y) => iF(x, y) && iN(x, y) && !iA(x, y)],
        ['n(F ∩ A)', D.FA, (x, y) => iF(x, y) && iA(x, y) && !iN(x, y)],
        ['n(N ∩ A)', D.NA, (x, y) => iN(x, y) && iA(x, y) && !iF(x, y)],
        ['n(F ∩ N ∩ A)', D.FNA, (x, y) => iF(x, y) && iN(x, y) && iA(x, y)],
      ];
      clues = defs.map(([label, val, test]) => {
        const p = regionPoint(U, test);
        return { label, val, x: p.x, y: p.y, got: false };
      });
      serp = [F, N, A].map((c, i) => ({
        cx: c.x,
        cy: c.y,
        R: c.r * 0.64,
        k: 0.85,
        ph: rnd(0, 6.28),
        w: (i % 2 ? -1 : 1) * rnd(0.75, 0.95),
        seg: [],
      }));
      serp.push({ cx, cy: (F.y + N.y + A.y) / 3, R: r * 0.42, k: 1, ph: 0, w: -1, seg: [] });
      b = Boat(U.x + 44, U.y + U.h - 44);
    };
    function questions() {
      state = 'wait';
      const f = D.F,
        n = D.N,
        a = D.A,
        FN = D.FN,
        FA = D.FA,
        NA = D.NA,
        FNA = D.FNA,
        tot = D.tot;
      const u = f + n + a - FN - FA - NA + FNA,
        sf = f - FN - FA + FNA;
      askSeq(
        [
          mkQ(
            'Com todos os pergaminhos em mãos: quantos moradores pertencem a pelo menos uma guilda? Ou seja, quanto vale <b>n(F ∪ N ∪ A)</b>?',
            u,
            [f + n + a, u - FNA, u + FNA, tot],
            `n(F ∪ N ∪ A) = ${f} + ${n} + ${a} − ${FN} − ${FA} − ${NA} + ${FNA} = ${u}.`,
          ),
          mkQ(
            `O reino tem ${tot} moradores. Quantos <b>não pertencem a nenhuma</b> das três guildas?`,
            tot - u,
            [tot - (f + n + a), tot - (u - FNA), FNA],
            `Nenhuma = total − n(F ∪ N ∪ A) = ${tot} − ${u} = ${tot - u}.`,
          ),
          mkQ(
            'Quantos moradores são <b>só Ferreiros</b>, sem pertencer a nenhuma outra guilda?',
            sf,
            [f - FN - FA, f - FN, f],
            `Só F = n(F) − n(F ∩ N) − n(F ∩ A) + n(F ∩ N ∩ A) = ${f} − ${FN} − ${FA} + ${FNA} = ${sf}. O centro volta porque foi descontado duas vezes.`,
          ),
        ],
        errs => {
          P.errors += errs;
          finishPhase(P.errors);
        },
      );
    }
    P.update = dt => {
      for (const s of serp) {
        s.ph += s.w * dt;
        s.seg = [];
        for (let i = 0; i < 6; i++) {
          const p = s.ph - Math.sign(s.w) * i * 0.14;
          s.seg.push({ x: s.cx + Math.cos(p) * s.R, y: s.cy + Math.sin(p) * s.R * s.k });
        }
      }
      if (endIn != null) {
        endIn -= dt;
        if (endIn <= 0) {
          endIn = null;
          questions();
        }
        return;
      }
      steer(b, dt, U);
      if (b.inv <= 0)
        for (const s of serp) {
          if (s.seg.some((p, i) => dist(b.x, b.y, p.x, p.y) < b.r + (i ? 8 : 11))) {
            P.lives--;
            b.inv = 1.6;
            SFX.hit();
            shake();
            flash('bad');
            const dx = b.x - s.seg[0].x,
              dy = b.y - s.seg[0].y,
              d = Math.hypot(dx, dy) || 1;
            b.vx = (dx / d) * 300;
            b.vy = (dy / d) * 300;
            if (P.lives <= 0) {
              failPhase('As serpentes afundaram o barco.');
              return;
            }
            break;
          }
        }
      for (const c of clues)
        if (!c.got && dist(b.x, b.y, c.x, c.y) < b.r + 14) {
          c.got = true;
          got++;
          SFX.pick();
          floatText(c.x, c.y - 28, `${c.label} = ${c.val}`, COL.brass);
          if (got === clues.length) {
            endIn = 1;
            SFX.ok();
            flash('ok');
          }
        }
      P.hud();
    };
    function drawScroll(c) {
      if (c.got) return;
      const y = c.y + Math.sin(T * 2 + c.x) * 3,
        tilt = Math.sin(T * 1.5 + c.x) * 0.12;
      ctx.save();
      ctx.translate(c.x, y);
      const g = ctx.createRadialGradient(0, 0, 4, 0, 0, 26);
      g.addColorStop(0, 'rgba(224,176,79,.45)');
      g.addColorStop(1, 'rgba(224,176,79,0)');
      ctx.fillStyle = g;
      circ(0, 0, 26 + Math.sin(T * 3) * 2);
      ctx.fill();
      ctx.rotate(tilt);
      ctx.fillStyle = '#efe0b4';
      ctx.strokeStyle = '#7a5a22';
      ctx.lineWidth = 1.4;
      roundRect(-9, -11, 18, 22, 2);
      ctx.fill();
      ctx.stroke();
      ctx.strokeStyle = 'rgba(122,90,34,.6)';
      ctx.lineWidth = 1;
      for (const ly of [-6, -2, 2]) {
        ctx.beginPath();
        ctx.moveTo(-5, ly);
        ctx.lineTo(5, ly);
        ctx.stroke();
      }
      const rg = ctx.createLinearGradient(0, -15, 0, -9);
      rg.addColorStop(0, '#dcc282');
      rg.addColorStop(1, '#a8884a');
      ctx.fillStyle = rg;
      roundRect(-12, -15, 24, 6, 3);
      ctx.fill();
      roundRect(-12, 9, 24, 6, 3);
      ctx.fill();
      ctx.fillStyle = '#c0392b';
      circ(0, 7, 3.4);
      ctx.fill();
      ctx.rotate(-tilt);
      pill(c.label, 0, -20 - 11 * UI, COL.brass, 11);
      ctx.restore();
    }
    function drawSerpent(s) {
      if (s.seg.length < 2) return;
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      const path = (ox, oy) => {
        ctx.beginPath();
        s.seg.forEach((p, i) => (i ? ctx.lineTo(p.x + ox, p.y + oy) : ctx.moveTo(p.x + ox, p.y + oy)));
      };
      path(3, 4);
      ctx.strokeStyle = 'rgba(0,0,0,.28)';
      ctx.lineWidth = 18;
      ctx.stroke();
      path(0, 0);
      ctx.strokeStyle = '#176b57';
      ctx.lineWidth = 17;
      ctx.stroke();
      ctx.strokeStyle = '#36c7a2';
      ctx.lineWidth = 10;
      ctx.stroke();
      ctx.strokeStyle = 'rgba(200,255,235,.35)';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.fillStyle = '#ffe066';
      s.seg.forEach((p, i) => {
        if (i && i % 2 === 0) {
          circ(p.x, p.y, 2.2);
          ctx.fill();
        }
      });
      const h = s.seg[0],
        n = s.seg[1],
        ang = Math.atan2(h.y - n.y, h.x - n.x);
      ctx.translate(h.x, h.y);
      ctx.rotate(ang);
      const tw = Math.sin(T * 20) * 2;
      ctx.fillStyle = '#ff6166';
      ctx.beginPath();
      ctx.moveTo(10, 0);
      ctx.lineTo(19 + tw, -3);
      ctx.lineTo(15, 0);
      ctx.lineTo(19 + tw, 3);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#2fae8d';
      ctx.strokeStyle = '#145c4b';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(2, 0, 12, 9, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#ffe066';
      circ(5, -4.5, 2.8);
      ctx.fill();
      circ(5, 4.5, 2.8);
      ctx.fill();
      ctx.fillStyle = '#111';
      ctx.fillRect(5, -6, 1.2, 3);
      ctx.fillRect(5, 3, 1.2, 3);
      ctx.restore();
    }
    P.draw = () => {
      drawU(U, `U = Reino · ${D.tot} moradores`);
      [F, N, A].forEach(c => drawTerr(c));
      clues.forEach(drawScroll);
      serp.forEach(drawSerpent);
      drawWake();
      drawBoat(b);
      [F, N, A].forEach(c => drawLabel(c));
    };
    P.hud = () => {
      setLives(P.lives, 3);
      setTimer(null);
      setInfo(
        `<div class="stats">${clues.map(c => `<span class="${c.got ? '' : 'dim'}">${c.label} = ${c.got ? c.val : '?'}</span>`).join('')}</div><div class="sub2">Pergaminhos ${got}/7 · n(U) = ${D.tot} moradores</div>`,
      );
    };
    return P;
  }

  // ================== FASE 5: A NÉVOA DO CAOS ==================

  /*
   * BANCO DE QUESTÕES DO CHEFÃO (16 questões). A alternativa CERTA é sempre a PRIMEIRA da lista 'a';
   * o jogo embaralha as alternativas antes de mostrar.
   */
  const BANK = [
    {
      q: 'Numa turma de 40 alunos, 25 gostam de futebol, 18 gostam de vôlei e 8 gostam dos dois. Quantos não gostam de nenhum dos dois esportes?',
      a: ['5', '13', '3', '7'],
      expl: 'n(F ∪ V) = 25 + 18 − 8 = 35. Logo, 40 − 35 = 5 não gostam de nenhum.',
    },
    {
      q: 'Se n(A) = 12, n(B) = 9 e n(A ∩ B) = 4, quanto vale n(A ∪ B)?',
      a: ['17', '21', '13', '25'],
      expl: 'n(A ∪ B) = 12 + 9 − 4 = 17.',
    },
    {
      q: 'Sabendo que n(A ∪ B) = 30, n(A) = 18 e n(B) = 20, quanto vale n(A ∩ B)?',
      a: ['8', '12', '2', '38'],
      expl: 'n(A ∩ B) = n(A) + n(B) − n(A ∪ B) = 18 + 20 − 30 = 8.',
    },
    {
      q: 'Numa pesquisa com 100 pessoas, 60 usam o app X, 50 usam o app Y e 20 usam os dois. Quantas usam apenas o app X?',
      a: ['40', '60', '20', '30'],
      expl: 'Só X = n(X) − n(X ∩ Y) = 60 − 20 = 40.',
    },
    {
      q: 'Na pesquisa com 100 pessoas (60 usam X, 50 usam Y e 20 usam os dois), quantas não usam nenhum dos dois apps?',
      a: ['10', '0', '30', '20'],
      expl: 'n(X ∪ Y) = 60 + 50 − 20 = 90. Então 100 − 90 = 10 não usam nenhum.',
    },
    {
      q: 'Dados A = {1, 2, 3, 4, 5} e B = {4, 5, 6, 7}, qual é a cardinalidade de A ∪ B?',
      a: ['7', '9', '2', '5'],
      expl: 'A ∪ B = {1, 2, 3, 4, 5, 6, 7}, com 7 elementos. O 4 e o 5 não podem ser contados duas vezes.',
    },
    {
      q: 'Qual é a fórmula do Princípio da Inclusão e Exclusão para dois conjuntos?',
      a: [
        'n(A ∪ B) = n(A) + n(B) − n(A ∩ B)',
        'n(A ∪ B) = n(A) + n(B) + n(A ∩ B)',
        'n(A ∪ B) = n(A) + n(B)',
        'n(A ∪ B) = n(A) · n(B)',
      ],
      expl: 'Somamos os dois conjuntos e descontamos a interseção, que foi contada duas vezes.',
    },
    {
      q: 'Por que subtraímos n(A ∩ B) na fórmula de n(A ∪ B)?',
      a: [
        'Porque os elementos da interseção foram contados duas vezes',
        'Porque a interseção é sempre vazia',
        'Porque a interseção não pertence à união',
        'Porque a união é menor que a interseção',
      ],
      expl: 'Quem está em A ∩ B aparece em n(A) e também em n(B). Descontando uma vez, cada elemento é contado só uma vez.',
    },
    {
      q: 'Num grupo, n(A) = 50, n(B) = 40, n(C) = 30, n(A ∩ B) = 15, n(A ∩ C) = 10, n(B ∩ C) = 8 e n(A ∩ B ∩ C) = 5. Quanto vale n(A ∪ B ∪ C)?',
      a: ['92', '87', '120', '97'],
      expl: 'n(A ∪ B ∪ C) = 50 + 40 + 30 − 15 − 10 − 8 + 5 = 92.',
    },
    {
      q: 'Se n(A) = 4, quantos elementos tem o conjunto das partes de A, P(A)?',
      a: ['16', '8', '4', '12'],
      expl: 'n(P(A)) = 2ⁿ = 2⁴ = 16 subconjuntos.',
    },
    {
      q: 'Num Diagrama de Venn com dois conjuntos, a região "só A" corresponde a qual operação?',
      a: ['A − B', 'A ∩ B', 'B − A', '(A ∪ B)ᶜ'],
      expl: '"Só A" são os elementos de A que não estão em B, ou seja, A − B.',
    },
    {
      q: 'Numa escola, 70 alunos estudam inglês, 45 estudam espanhol e 100 estudam pelo menos uma das duas línguas. Quantos estudam as duas?',
      a: ['15', '25', '5', '115'],
      expl: 'n(I ∩ E) = n(I) + n(E) − n(I ∪ E) = 70 + 45 − 100 = 15.',
    },
    {
      q: 'Se A ⊂ B, com n(A) = 6 e n(B) = 10, quanto vale n(A ∪ B)?',
      a: ['10', '16', '6', '4'],
      expl: 'Se A está contido em B, a união é o próprio B: n(A ∪ B) = 10.',
    },
    {
      q: 'A e B são disjuntos (A ∩ B = ∅), com n(A) = 7 e n(B) = 5. Quanto vale n(A ∪ B)?',
      a: ['12', '2', '35', '7'],
      expl: 'Como a interseção é vazia, ninguém é contado duas vezes: 7 + 5 = 12.',
    },
    {
      q: 'Entre 200 estudantes, 90 gostam de Matemática, 80 de Física e 70 de Química; 30 gostam de Mat. e Fís., 25 de Mat. e Quím., 20 de Fís. e Quím., e 10 das três. Quantos não gostam de nenhuma?',
      a: ['25', '35', '15', '175'],
      expl: 'União = 90 + 80 + 70 − 30 − 25 − 20 + 10 = 175. Nenhuma = 200 − 175 = 25.',
    },
    {
      q: 'Qual é a cardinalidade do conjunto {a, b, {a, b}, ∅}?',
      a: ['4', '2', '3', '5'],
      expl: 'São 4 elementos: a, b, o conjunto {a, b} e o conjunto vazio. Cada um conta como um elemento.',
    },
  ];

  /*
   * FASE 5 — A NÉVOA DO CAOS (chefão)
   * Perguntas sorteadas do BANK; o jogador pilota até a esfera A, B, C ou D da resposta certa.
   * A Névoa tem 6 de vida (6 acertos para vencer) e fica mais agressiva conforme perde vida.
   */
  function Phase5() {
    const P = { name: 'Fase 5 · A Névoa do Caos', errors: 0, lives: 5, hp: 6 };
    P.intro = [
      'Lá está ela: a <b>Névoa do Caos</b>, a tempestade que apagou o censo! Ela quer embaralhar tudo de novo.',
      'Ela vai lançar perguntas sobre tudo o que você aprendeu. A pergunta e as alternativas aparecem lá em cima, e no mar surgem esferas <b>A, B, C e D</b>. Pilote até a esfera da resposta certa.',
      'Cada acerto dispara um raio de luz que enfraquece a Névoa. São <b>6 acertos</b> para vencê-la. Errar uma pergunta custa um coração.',
      'Enquanto isso, desvie das gotas da tempestade e dos relâmpagos: a faixa vermelha mostra onde o raio vai cair. Você tem 5 corações. Boa sorte, meninos!',
    ];
    P.outro = ['Conseguimos, meninos! A Névoa do Caos se desfez! O céu do arquipélago está limpo de novo.'];
    let ar,
      b,
      bank,
      qi = 0,
      q = null,
      orbs = [],
      qDelay = 1.4,
      drops = [],
      bolts = [],
      dropT = 1.6,
      boltT = 4,
      beam = 0,
      endIn = null,
      sx,
      sy,
      hitFlash = 0,
      qn = 0;
    P.init = () => {
      ar = { x: 12, y: LH * 0.24, w: LW - 24, h: LH * 0.76 - 12 };
      b = Boat(LW / 2, LH - 60);
      bank = shuffle(BANK);
      sx = LW / 2;
      sy = Math.max(80, LH * 0.12);
    };
    // Sorteia a próxima pergunta, embaralha as alternativas e espalha as esferas pelo mapa.
    function nextQ() {
      if (qi >= bank.length) {
        bank = shuffle(BANK);
        qi = 0;
      }
      const raw = bank[qi++];
      const order = shuffle([0, 1, 2, 3]);
      q = { q: raw.q, opts: order.map(i => raw.a[i]), correct: order.indexOf(0), expl: raw.expl };
      qn++;
      orbs = [];
      let md = 110;
      for (let i = 0; i < 4; i++) {
        let p = null;
        for (let t = 0; t < 220 && !p; t++) {
          if (t === 120) md = 70;
          const x = rnd(ar.x + 30, ar.x + ar.w - 30),
            y = rnd(ar.y + 30, ar.y + ar.h - 30);
          if (dist(x, y, b.x, b.y) > 110 && orbs.every(o => dist(x, y, o.x, o.y) > md)) p = { x, y };
        }
        p = p || { x: rnd(ar.x + 30, ar.x + ar.w - 30), y: rnd(ar.y + 30, ar.y + ar.h - 30) };
        orbs.push({ i, x: p.x, y: p.y, ph: rnd(0, 6) });
      }
    }
    function hurt() {
      P.lives--;
      b.inv = 1.6;
      SFX.hit();
      shake();
      flash('bad');
      if (P.lives <= 0) failPhase('A Névoa do Caos venceu desta vez.');
    }
    // O barco tocou a esfera i: acerto tira vida da Névoa, erro tira um coração.
    function answer(i) {
      const ok = i === q.correct,
        cq = q;
      q = null;
      orbs = [];
      if (ok) {
        elogioRaro();
        P.hp--;
        beam = 0.6;
        hitFlash = 0.5;
        SFX.ok();
        setTimeout(SFX.zap, 90);
        flash('ok');
        floatText(sx, sy + 72, 'Acertou!', COL.ok);
        qDelay = 1.1;
        if (P.hp <= 0) {
          endIn = 1.6;
        }
      } else {
        P.errors++;
        SFX.bad();
        toast(`<b>A resposta era ${'ABCD'[cq.correct]}: ${cq.opts[cq.correct]}.</b> ${cq.expl}`, 4400);
        qDelay = 3.2;
        hurt();
      }
    }
    P.update = dt => {
      sx = LW / 2 + Math.sin(T * 0.6) * LW * 0.25;
      sy = Math.max(80, LH * 0.12) + Math.sin(T * 1.3) * 6;
      beam = Math.max(0, beam - dt);
      hitFlash = Math.max(0, hitFlash - dt);
      if (endIn != null) {
        endIn -= dt;
        drops = [];
        bolts = [];
        P.hud();
        if (endIn <= 0) {
          endIn = null;
          finishPhase(P.errors);
        }
        return;
      }
      steer(b, dt, ar);
      if (!q) {
        qDelay -= dt;
        if (qDelay <= 0) nextQ();
      } else
        for (const o of orbs) {
          if (dist(b.x, b.y, o.x, o.y + Math.sin(T * 2 + o.ph) * 4) < b.r + 20) {
            answer(o.i);
            break;
          }
        }
      if (state !== 'play') return;
      dropT -= dt;
      if (dropT <= 0) {
        dropT = Math.max(0.28, 0.8 - (6 - P.hp) * 0.09);
        const n = P.hp <= 4 ? 2 : 1;
        for (let k = 0; k < n; k++)
          drops.push({
            x: sx + rnd(-50, 50),
            y: sy + 30,
            vx: (b.x - sx) * 0.3 + rnd(-70, 70),
            vy: rnd(200, 300),
          });
      }
      for (const d of drops) {
        d.x += d.vx * dt;
        d.y += d.vy * dt;
        if (b.inv <= 0 && dist(b.x, b.y, d.x, d.y) < b.r + 7) {
          d.dead = true;
          hurt();
          if (state !== 'play') return;
        }
      }
      drops = drops.filter(d => !d.dead && d.y < LH + 20);
      boltT -= dt;
      if (boltT <= 0) {
        boltT = rnd(2.2, 3.4);
        bolts.push({
          x: clamp(b.x + rnd(-50, 50), 30, LW - 30),
          warn: 1,
          strike: 0.3,
          zap: false,
          pts: null,
        });
        if (P.hp <= 3)
          bolts.push({
            x: clamp(b.x + (Math.random() < 0.5 ? -1 : 1) * rnd(110, 200), 30, LW - 30),
            warn: 1,
            strike: 0.3,
            zap: false,
            pts: null,
          });
      }
      for (const z of bolts) {
        if (z.warn > 0) z.warn -= dt;
        else {
          if (!z.zap) {
            z.zap = true;
            SFX.zap();
            z.pts = [];
            for (let y = sy + 40; y <= LH; y += 28) z.pts.push([z.x + rnd(-12, 12), y]);
          }
          z.strike -= dt;
          if (z.strike > 0 && b.inv <= 0 && Math.abs(b.x - z.x) < 24) {
            hurt();
            if (state !== 'play') return;
          }
        }
      }
      bolts = bolts.filter(z => z.strike > 0);
      P.hud();
    };
    function drawStorm() {
      ctx.save();
      ctx.translate(sx, sy);
      const hit = hitFlash > 0;
      ctx.strokeStyle = 'rgba(155,134,238,.4)';
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 8; i++) {
        const x = -56 + i * 16 + Math.sin(T * 3 + i) * 3,
          y0 = 38 + ((T * 90 + i * 23) % 44);
        ctx.beginPath();
        ctx.moveTo(x, y0);
        ctx.lineTo(x - 4, y0 + 12);
        ctx.stroke();
      }
      for (const [x, y, r] of [
        [-52, 10, 30],
        [-26, -8, 36],
        [10, -16, 40],
        [46, 2, 32],
        [0, 14, 36],
        [-34, 24, 26],
        [34, 24, 26],
      ]) {
        const px = x + Math.sin(T * 1.5 + x) * 2,
          py = y + Math.cos(T * 1.3 + y) * 2;
        const g = ctx.createRadialGradient(px - r * 0.3, py - r * 0.4, r * 0.15, px, py, r);
        g.addColorStop(0, hit ? '#f3efff' : '#8575b5');
        g.addColorStop(1, hit ? '#bdb3f0' : '#352a56');
        ctx.fillStyle = g;
        circ(px, py, r);
        ctx.fill();
      }
      if (Math.sin(T * 7) > 0.9 || hit) {
        ctx.strokeStyle = 'rgba(255,240,170,.95)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-30, -14);
        ctx.lineTo(-20, 0);
        ctx.lineTo(-26, 2);
        ctx.lineTo(-14, 18);
        ctx.stroke();
      }
      const ex = clamp((b.x - sx) / 120, -1, 1) * 2.5,
        ey = clamp((b.y - sy) / 300, -1, 1) * 2;
      ctx.fillStyle = '#fff6d0';
      ctx.shadowColor = '#ffe066';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.ellipse(-16, 0, 8, 6, -0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(16, 0, 8, 6, 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#24123a';
      circ(-16 + ex, ey, 3.2);
      ctx.fill();
      circ(16 + ex, ey, 3.2);
      ctx.fill();
      ctx.strokeStyle = '#1c1030';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-27, -12);
      ctx.lineTo(-8, -6);
      ctx.moveTo(27, -12);
      ctx.lineTo(8, -6);
      ctx.stroke();
      ctx.strokeStyle = '#ffe066';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(-12, 23);
      ctx.lineTo(-6, 18);
      ctx.lineTo(0, 23);
      ctx.lineTo(6, 18);
      ctx.lineTo(12, 23);
      ctx.stroke();
      const w = 140;
      ctx.fillStyle = 'rgba(6,22,31,.92)';
      roundRect(-w / 2 - 3, -71, w + 6, 15, 7.5);
      ctx.fill();
      const hg = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
      hg.addColorStop(0, '#ff9a9e');
      hg.addColorStop(1, COL.bad);
      ctx.fillStyle = hg;
      roundRect(-w / 2, -68, Math.max(0, w * (P.hp / 6)), 9, 4.5);
      ctx.fill();
      ctx.restore();
    }
    P.draw = () => {
      // zona da tempestade (fora do alcance do barco) escurecida e a área do barco com borda clara
      ctx.save();
      ctx.fillStyle = 'rgba(20,10,40,.35)';
      ctx.fillRect(-LW, -LH, LW * 3, ar.y + LH);
      ctx.fillRect(-LW, ar.y, ar.x + LW, LH * 2);
      ctx.fillRect(ar.x + ar.w, ar.y, LW * 2, LH * 2);
      ctx.fillRect(-LW, ar.y + ar.h, LW * 3, LH * 2);
      ctx.fillStyle = 'rgba(224,176,79,.05)';
      roundRect(ar.x, ar.y, ar.w, ar.h, 14);
      ctx.fill();
      const pulse = 0.75 + 0.25 * Math.sin(T * 3);
      ctx.shadowColor = 'rgba(224,176,79,.8)';
      ctx.shadowBlur = 12 * pulse;
      ctx.strokeStyle = `rgba(224,176,79,${(0.85 * pulse).toFixed(3)})`;
      ctx.lineWidth = 3;
      roundRect(ar.x, ar.y, ar.w, ar.h, 14);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(224,176,79,.35)';
      ctx.setLineDash([10, 8]);
      ctx.lineWidth = 1.5;
      roundRect(ar.x + 7, ar.y + 7, ar.w - 14, ar.h - 14, 10);
      ctx.stroke();
      ctx.setLineDash([]);
      pill('LIMITE DO BARCO', ar.x + ar.w / 2, ar.y, COL.brass, 12);
      ctx.restore();
      for (const z of bolts) {
        if (z.warn > 0) {
          ctx.fillStyle = `rgba(255,97,102,${(0.14 + 0.1 * Math.sin(T * 20)).toFixed(3)})`;
          ctx.fillRect(z.x - 24, sy + 40, 48, LH);
        } else if (z.pts) {
          ctx.save();
          ctx.strokeStyle = '#fff6c8';
          ctx.lineWidth = 5;
          ctx.shadowColor = '#ffe066';
          ctx.shadowBlur = 22;
          ctx.beginPath();
          z.pts.forEach((p, i) => {
            if (i) ctx.lineTo(p[0], p[1]);
            else ctx.moveTo(p[0], p[1]);
          });
          ctx.stroke();
          ctx.restore();
        }
      }
      drawStorm();
      for (const o of orbs) {
        const y = o.y + Math.sin(T * 2 + o.ph) * 4;
        ctx.save();
        ctx.translate(o.x, y);
        ctx.shadowColor = COL.brass;
        ctx.shadowBlur = 18;
        const g = ctx.createRadialGradient(-7, -7, 2, 0, 0, 22);
        g.addColorStop(0, '#fff1c4');
        g.addColorStop(0.6, '#e0b04f');
        g.addColorStop(1, '#8f6420');
        ctx.fillStyle = g;
        circ(0, 0, 21);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255,241,196,.8)';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 6]);
        ctx.lineDashOffset = -T * 20;
        circ(0, 0, 27);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(255,255,255,.55)';
        ctx.beginPath();
        ctx.ellipse(-7, -9, 7, 4, -0.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#2a1b04';
        ctx.font = `800 20px ${FONT}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('ABCD'[o.i], 0, 1);
        ctx.restore();
      }
      for (const d of drops) {
        const dg = ctx.createLinearGradient(d.x, d.y - 14, d.x, d.y + 7);
        dg.addColorStop(0, '#ddd4ff');
        dg.addColorStop(1, '#6a52d6');
        ctx.fillStyle = dg;
        ctx.beginPath();
        ctx.moveTo(d.x, d.y - 14);
        ctx.quadraticCurveTo(d.x + 8, d.y - 2, d.x, d.y + 7);
        ctx.quadraticCurveTo(d.x - 8, d.y - 2, d.x, d.y - 14);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.65)';
        circ(d.x - 2, d.y - 1, 1.8);
        ctx.fill();
      }
      if (beam > 0) {
        ctx.save();
        ctx.globalAlpha = beam / 0.6;
        ctx.strokeStyle = '#fff3c4';
        ctx.lineWidth = 6;
        ctx.shadowColor = COL.brass;
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        ctx.lineTo(sx, sy);
        ctx.stroke();
        ctx.restore();
      }
      drawWake();
      drawBoat(b);
    };
    P.hud = () => {
      setLives(P.lives, 5);
      setTimer(null);
      const head = `<div class="eyebrow">${q ? `Pergunta ${qn} · ` : ''}Névoa ${P.hp}/6</div>`;
      if (q)
        setInfo(
          head +
            `<div class="qline">${q.q}</div><ol class="optl">${q.opts.map((o, i) => `<li><span class="k">${'ABCD'[i]}</span><span>${o}</span></li>`).join('')}</ol>`,
        );
      else
        setInfo(
          head +
            `<div class="qline dim">${endIn != null ? 'A Névoa está se desfazendo!' : 'A Névoa prepara a próxima pergunta…'}</div>`,
        );
    };
    return P;
  }

  // ================== LAÇO PRINCIPAL ==================

  /*
   * LAÇO PRINCIPAL: chamado pelo navegador ~60 vezes por segundo (requestAnimationFrame).
   *   dt = tempo desde o quadro anterior (limitado a 0,05 s)
   *   se estiver jogando -> phase.update(dt)
   *   depois redesenha tudo: mar -> fase -> textos flutuantes
   */
  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000 || 0);
    last = t;
    T += dt;
    if (state === 'play' && phase) phase.update(dt);
    if (shakeT > 0) shakeT -= dt;
    for (const f of floats) f.t += dt;
    for (let i = floats.length - 1; i >= 0; i--) if (floats[i].t > 1.4) floats.splice(i, 1);
    for (const w of wake) w.t += dt;
    for (let i = wake.length - 1; i >= 0; i--) if (wake[i].t > 1) wake.splice(i, 1);
    drawSea((phase && phase.scroll) || 0);
    if (phase) phase.draw();
    else drawMenuBg();
    drawFloats();
    requestAnimationFrame(frame);
  }
  resize();
  menu();
  requestAnimationFrame(frame);
})();

</script>
